<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NN-LTP 2026-2050 Stakeholder Consultation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1B4332; --green-deep:#122E22; --green-soft:#2D6A4F;
  --gold:#D4A94F; --gold-soft:#E8CD8A;
  --paper:#FAF8F3; --panel:#FFFFFF; --ink:#22292F; --muted:#6B7060;
  --rust:#B54834; --line:#E3DFD3;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Source Serif 4',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ---------- shell ---------- */
.app{max-width:900px;margin:0 auto;padding:0 24px 80px;min-height:100vh;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
  padding:20px 0;border-bottom:2px solid var(--green);margin-bottom:8px;
}
.brand{display:flex;align-items:center;gap:16px;}
.brand img.logo{height:42px;width:auto;object-fit:contain;}
.brand .divider{width:1px;height:34px;background:var(--line);}
.brand-text{line-height:1.25;}
.brand-text .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--green-soft);}
.brand-text .title{font-family:'Source Serif 4',serif;font-weight:600;font-size:15px;color:var(--green-deep);}

.topbar-right{display:flex;align-items:center;gap:14px;}
.lang-toggle{display:flex;border:1.5px solid var(--green);border-radius:20px;overflow:hidden;}
.lang-toggle button{
  border:none;background:var(--panel);color:var(--green-deep);font-family:'IBM Plex Mono',monospace;
  font-size:12px;font-weight:600;padding:7px 16px;cursor:pointer;transition:background .15s,color .15s;
}
.lang-toggle button.active{background:var(--green);color:#fff;}

/* ---------- screens ---------- */
.screen{display:none;animation:fadein .25s ease;}
.screen.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ---------- hero / selector ---------- */
.hero{padding:34px 0 8px;text-align:left;}
.hero h1{font-family:'Source Serif 4',serif;font-weight:600;font-size:clamp(24px,4vw,34px);color:var(--green-deep);margin:0 0 10px;letter-spacing:-.01em;}
.hero .sub{font-size:14.5px;color:var(--muted);max-width:640px;margin:0;}

/* ---------- context panel ---------- */
.context-toggle{
  display:inline-flex;align-items:center;gap:7px;margin:18px 0 6px;padding:9px 16px;
  background:var(--panel);border:1.5px solid var(--gold);border-radius:20px;cursor:pointer;
  font-size:12.5px;font-weight:600;color:var(--green-deep);
}
.context-toggle .arrow{transition:transform .2s;}
.context-toggle.open .arrow{transform:rotate(180deg);}
.context-panel{
  max-height:0;overflow:hidden;transition:max-height .3s ease;background:var(--panel);
  border-radius:6px;border:1.5px solid var(--line);margin-top:0;
}
.context-panel.open{max-height:1400px;margin-top:14px;}
.context-inner{padding:22px 24px;}
.context-block{margin-bottom:18px;}
.context-block:last-child{margin-bottom:0;}
.context-block h3{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);margin:0 0 6px;
}
.context-block p{font-size:13.5px;color:var(--ink);margin:0;line-height:1.6;}

.cat-label{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);margin:30px 0 14px;display:flex;align-items:center;gap:10px;
}
.cat-label::after{content:'';flex:1;height:1px;background:var(--line);}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(max-width:640px){.grid{grid-template-columns:1fr;}}
.card{
  background:var(--panel);border:1.5px solid var(--line);border-radius:6px;
  padding:16px 18px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;
  text-align:left;position:relative;
}
.card:hover{border-color:var(--green-soft);transform:translateY(-1px);box-shadow:0 4px 14px rgba(27,67,50,.08);}
.card .name-en{font-family:'Source Serif 4',serif;font-weight:600;font-size:15px;color:var(--green-deep);margin-bottom:8px;}
.card .meta{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);}
.lock-badge{display:inline-flex;align-items:center;gap:4px;color:var(--rust);}
.open-badge{display:inline-flex;align-items:center;gap:4px;color:var(--green-soft);}

.card.is-open{
  border:2px solid var(--gold);background:linear-gradient(180deg,#FFFDF6 0%,var(--panel) 100%);
}
.card.is-open:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(212,169,79,.25);}
.card-icon{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;
}
.card.is-open .card-icon{background:var(--gold);}
.card-icon svg{width:18px;height:18px;}

/* ---------- code gate ---------- */
.gate-wrap{max-width:440px;margin:60px auto 0;text-align:center;}
.gate-seal{
  width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
}
.gate-wrap h2{font-family:'Source Serif 4',serif;font-size:21px;color:var(--green-deep);margin:0 0 20px;}
.gate-wrap p{font-size:13.5px;color:var(--muted);margin-bottom:26px;}
.code-input{
  width:100%;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.35em;
  padding:16px;border:2px solid var(--line);border-radius:6px;background:var(--panel);color:var(--green-deep);
  text-transform:uppercase;
}
.code-input:focus{outline:none;border-color:var(--green-soft);}
.gate-error{color:var(--rust);font-size:13px;margin-top:12px;display:none;}
.back-link{display:inline-block;margin-top:26px;font-size:12.5px;color:var(--muted);cursor:pointer;text-decoration:underline;}

/* ---------- form ---------- */
.form-head{padding:30px 0 18px;border-bottom:2px solid var(--line);margin-bottom:26px;}
.form-head h1{font-family:'Source Serif 4',serif;font-weight:600;font-size:clamp(21px,3vw,27px);color:var(--green-deep);margin:0;}
.framing{background:var(--green-deep);color:var(--paper);border-radius:6px;padding:16px 20px;margin-top:14px;}
.framing .label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-soft);display:block;margin-bottom:6px;}
.framing p{font-size:13.5px;margin:0;line-height:1.55;}

.respondent-block{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:26px;}
.respondent-block .cat-label{margin:0 0 14px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;}
@media(max-width:640px){.field-row{grid-template-columns:1fr;}}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:5px;}
.field input,.field select{
  width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:4px;
  font-family:'Inter',sans-serif;font-size:13.5px;background:var(--panel);color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green-soft);}

.section-head{
  font-family:'Source Serif 4',serif;font-weight:600;font-size:16px;color:var(--green-deep);
  margin:34px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--gold);
}

.qcard{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:14px;}
.qnum{font-family:'IBM Plex Mono',monospace;color:var(--green-soft);font-weight:700;margin-right:6px;}
.qtext-en{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.5;}
.qcard textarea{
  width:100%;min-height:80px;margin-top:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;
  font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);resize:vertical;
}
.qsub-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:10px;}
@media(max-width:640px){.qsub-row{grid-template-columns:1fr;}}
.qsub-row .field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.qsub-row input,.qsub-row select{font-size:13px;}

.progress-track{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:16px 0 4px;position:sticky;top:0;}
.progress-fill{height:100%;background:var(--gold);transition:width .2s;}
.progress-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-bottom:20px;}

.closing-box{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:18px 20px;margin-top:24px;font-size:13px;color:var(--muted);}

button.submit{
  width:100%;background:var(--green);color:#fff;border:none;padding:15px;font-size:14.5px;font-weight:600;
  border-radius:6px;cursor:pointer;margin-top:20px;font-family:'Inter',sans-serif;transition:background .15s;
}
button.submit:hover{background:var(--green-deep);}
button.submit:disabled{opacity:.55;cursor:wait;}
.status{padding:12px 16px;border-radius:6px;font-size:13.5px;margin-top:14px;display:none;}
.status.ok{display:block;background:#E8F1EC;color:var(--green-deep);border-left:4px solid var(--green-soft);}
.status.err{display:block;background:#F7E7E3;color:var(--rust);border-left:4px solid var(--rust);}

/* ---------- confirmation ---------- */
.confirm-wrap{max-width:460px;margin:70px auto 0;text-align:center;}
.confirm-wrap .check{width:60px;height:60px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
.confirm-wrap h2{font-family:'Source Serif 4',serif;font-size:22px;color:var(--green-deep);}
.confirm-wrap p{font-size:14px;color:var(--muted);}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <img class="logo" id="logoTfnc" alt="Tanzania Food and Nutrition Centre">
    </div>
    <div class="topbar-right">
      <div class="brand-text" style="text-align:right;">
        <div class="eyebrow" id="topbarEyebrow"></div>
        <div class="title">NN-LTP 2026&#8211;2050</div>
      </div>
      <div class="lang-toggle">
        <button id="langEnBtn" class="active">EN</button>
        <button id="langSwBtn">SW</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 1: SELECTOR -->
  <div class="screen active" id="screen-select">
    <div class="hero">
      <h1 id="heroTitle"></h1>
      <p class="sub" id="heroSub"></p>
    </div>

    <div class="context-toggle" id="contextToggle">
      <span id="contextToggleLabel"></span>
      <span class="arrow">&#9660;</span>
    </div>
    <div class="context-panel" id="contextPanel">
      <div class="context-inner" id="contextInner"></div>
    </div>

    <div id="groupGrid"></div>
  </div>

  <!-- SCREEN 2: CODE GATE -->
  <div class="screen" id="screen-gate">
    <div class="gate-wrap">
      <div class="gate-seal">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="10" width="14" height="10" rx="1.5" stroke="#D4A94F" stroke-width="1.6"/><path d="M8 10V7a4 4 0 018 0v3" stroke="#D4A94F" stroke-width="1.6"/></svg>
      </div>
      <h2 id="gateName"></h2>
      <p id="gateIntro"></p>
      <input type="text" class="code-input" id="codeInput" maxlength="12">
      <div class="gate-error" id="gateError"></div>
      <div class="back-link" id="backFromGate"></div>
    </div>
  </div>

  <!-- SCREEN 3: FORM -->
  <div class="screen" id="screen-form">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
    <div class="form-head" id="formHead"></div>
    <div class="respondent-block" id="respondentBlock"></div>
    <form id="qForm">
      <div id="sectionsContainer"></div>
      <div id="evidenceUploadBlock"></div>
      <div class="closing-box" id="closingBox"></div>
      <button type="submit" class="submit" id="submitBtn"></button>
      <div class="status" id="statusBox"></div>
    </form>
    <div class="back-link" id="backFromForm"></div>
  </div>

  <!-- SCREEN 4: CONFIRMATION -->
  <div class="screen" id="screen-confirm">
    <div class="confirm-wrap">
      <div class="check"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2 id="confirmTitle"></h2>
      <p id="confirmClosing" style="margin-top:20px;"></p>
      <div class="back-link" id="backFromConfirm"></div>
    </div>
  </div>

</div>
<script>
const SHEETMONKEY_URL = "https://api.sheetmonkey.io/form/hpPzECijwu7exxqMkTVsvx";
var DATA = {"academia": {"title_en": "NN-LTP 2026-2050 STAKEHOLDER CONSULTATION | ACADEMIA AND RESEARCH INSTITUTIONS", "title_sw": "MASHAURIANO NA WADAU YA NN-LTP 2026-2050 | TAASISI ZA TAALUMA NA UTAFITI", "framing_en": "WHY YOUR VOICE MATTERS: Universities, research institutes and think tanks generate the evidence base, test what works, and train the professionals who will carry the plan to 2050. Their contribution anchors the NN-LTP in rigorous, Tanzania-specific knowledge.", "framing_sw": "KWA NINI SAUTI YAKO NI MUHIMU: Vyuo vikuu, taasisi za utafiti na taasisi za fikra huzalisha msingi wa ushahidi, hujaribu kinachofanya kazi na kuwafundisha wataalamu watakaoutekeleza mpango hadi 2050. Mchango wao unaiweka NN-LTP katika maarifa thabiti na mahususi kwa Tanzania.", "resp_fields": [{"en": "Institution / Network / Organisation:", "sw": "Taasisi / Mtandao / Shirika:"}, {"en": "Region / Council (if applicable):", "sw": "Mkoa / Halmashauri (ikiwa inahusika):"}, {"en": "Name and title of lead respondent:", "sw": "Jina na cheo cha mtoa majibu mkuu:"}, {"en": "Contact (phone / email):", "sw": "Mawasiliano (simu / barua pepe):"}], "sections": [{"header_en": "A. Situation Analysis and Evidence Base", "header_sw": "A. Uchambuzi wa Hali na Msingi wa Ushahidi", "questions": [{"no": 1, "en": "From your research, which forms of malnutrition (stunting, wasting, micronutrient deficiency, overweight/obesity, diet-related NCDs) are most likely to dominate Tanzania's burden by 2035 and by 2050, and why?", "sw": "Kwa mujibu wa utafiti wako, ni aina zipi za utapiamlo (udumavu, ukondefu, upungufu wa virutubishi vidogo, uzito uliozidi/unenepaji na magonjwa yasiyoambukiza yanayohusiana na ulaji) zinazotarajiwa kutawala mzigo wa Tanzania ifikapo 2035 na 2050, na kwa nini?"}, {"no": 2, "en": "Which determinants of malnutrition in Tanzania do you consider under-researched or poorly measured today?", "sw": "Ni visababishi gani vya utapiamlo nchini Tanzania unavyoona havijafanyiwa utafiti wa kutosha au havipimwi vizuri kwa sasa?"}, {"no": 3, "en": "What existing datasets, cohorts or studies should the NN-LTP situation analysis draw on that are currently underused by policymakers?", "sw": "Ni seti gani za data, tafiti za makundi yanayofuatiliwa au tafiti zilizopo ambazo uchambuzi wa hali wa NN-LTP unapaswa kutumia lakini kwa sasa hazitumiwi vya kutosha na watunga sera?"}, {"no": 4, "en": "Where do you see the biggest disconnect between what the evidence says and what current nutrition programming actually does?", "sw": "Ni wapi unaona pengo kubwa zaidi kati ya ushahidi unachosema na kile ambacho programu za lishe za sasa hufanya kwa vitendo?"}], "is_open_header": false}, {"header_en": "B. Future Trends and Scenario Thinking", "header_sw": "B. Mwelekeo wa Baadaye na Uchambuzi wa Matukio", "questions": [{"no": 5, "en": "How do you expect urbanisation, climate change and dietary transition to reshape nutrition outcomes in Tanzania over the next 25 years?", "sw": "Unatarajia ukuaji wa miji, mabadiliko ya tabianchi na mabadiliko ya mifumo ya ulaji kubadilishaje matokeo ya lishe nchini Tanzania katika miaka 25 ijayo?"}, {"no": 6, "en": "Which emerging risks (e.g. ultra-processed foods, food system shocks, antimicrobial resistance, water stress) deserve explicit treatment in a 2050 plan?", "sw": "Ni hatari zipi zinazoibuka (kwa mfano vyakula vilivyosindikwa kupita kiasi, misukosuko ya mifumo ya chakula, usugu wa dawa za kuua vimelea na uhaba wa maji) zinazostahili kuainishwa wazi katika mpango wa 2050?"}, {"no": 7, "en": "What plausible scenarios (best case, business as usual, disrupted trajectory) should the plan model, and what key assumptions would you test in each?", "sw": "Ni matukio gani yanayowezekana (hali bora zaidi, kuendelea kama kawaida, au mwelekeo uliovurugika) ambayo mpango unapaswa kuigiza, na ni dhana zipi muhimu ungependa zijaribiwe katika kila tukio?"}], "is_open_header": false}, {"header_en": "C. Research and Learning Agenda", "header_sw": "C. Ajenda ya Utafiti na Ujifunzaji", "questions": [{"no": 8, "en": "If the NN-LTP could commission only five priority research questions for the first five years, what should they be?", "sw": "Iwapo NN-LTP ingeweza kuagiza maswali matano tu ya kipaumbele ya utafiti katika miaka mitano ya kwanza, yangekuwa yapi?"}, {"no": 9, "en": "What implementation research is needed to understand why proven interventions fail to scale in the Tanzanian context?", "sw": "Ni utafiti gani wa utekelezaji unaohitajika kuelewa kwa nini afua zilizothibitishwa hushindwa kupanuliwa katika mazingira ya Tanzania?"}, {"no": 10, "en": "How should the plan institutionalise the link between research findings and policy adjustment (e.g. review cycles, evidence panels, data observatories)?", "sw": "Mpango unapaswa kuujengeaje kitaasisi uhusiano kati ya matokeo ya utafiti na marekebisho ya sera (kwa mfano mizunguko ya mapitio, majopo ya ushahidi na vituo vya ufuatiliaji wa data)?"}, {"no": 11, "en": "What role should Tanzanian universities play in monitoring, evaluation and learning for the plan, and what capacity gaps must be addressed first?", "sw": "Vyuo vikuu vya Tanzania vinapaswa kuwa na jukumu gani katika ufuatiliaji, tathmini na ujifunzaji wa mpango, na ni mapungufu gani ya uwezo yanapaswa kushughulikiwa kwanza?"}], "is_open_header": false}, {"header_en": "D. Human Capital and Training", "header_sw": "D. Rasilimali Watu na Mafunzo", "questions": [{"no": 12, "en": "What nutrition-related skills and cadres will Tanzania need by 2050 that current curricula do not produce?", "sw": "Tanzania itahitaji ujuzi na kada zipi zinazohusiana na lishe ifikapo 2050 ambazo mitaala ya sasa haitoi?"}, {"no": 13, "en": "How can academia partner with government to build a pipeline of nutrition professionals at national, regional and council levels?", "sw": "Taasisi za taaluma zinawezaje kushirikiana na serikali kujenga mkondo endelevu wa wataalamu wa lishe katika ngazi ya taifa, mkoa na halmashauri?"}], "is_open_header": false}, {"header_en": "E. Governance and Accountability", "header_sw": "E. Utawala na Uwajibikaji", "questions": [{"no": 14, "en": "What independent accountability role can research institutions play in tracking NN-LTP milestones and validating reported results?", "sw": "Taasisi za utafiti zinaweza kuwa na jukumu gani huru la uwajibikaji katika kufuatilia hatua muhimu za NN-LTP na kuthibitisha matokeo yanayoripotiwa?"}, {"no": 15, "en": "What would make you confident that evidence will genuinely shape decisions across the plan's 25-year horizon?", "sw": "Ni nini kingekupa uhakika kwamba ushahidi utaongoza kwa dhati maamuzi katika kipindi chote cha miaka 25 cha mpango?"}], "is_open_header": false}, {"header_en": "F. Any other contribution, concern or proposal you wish the NN-LTP drafting team to consider", "header_sw": "F. Mchango, hoja, wasiwasi au pendekezo jingine lolote ambalo ungependa timu ya uandishi ya NN-LTP izingatie", "questions": [], "is_open_header": true}], "closing_en": "Thank you for your contribution. Return the completed template to the National Facilitator through TFNC within 10 working days.", "closing_sw": "Asante kwa mchango wako. Rejesha kiolezo kilichokamilishwa kwa Mwezeshaji wa Kitaifa kupitia TFNC ndani ya siku 10 za kazi."}, "csos": {"title_en": "NN-LTP 2026-2050 STAKEHOLDER CONSULTATION | CIVIL SOCIETY ORGANISATIONS", "title_sw": "MASHAURIANO NA WADAU YA NN-LTP 2026-2050 | ASASI ZA KIRAIA", "framing_en": "WHY YOUR VOICE MATTERS: CSOs mobilise communities, reach the most vulnerable, hold duty-bearers accountable, and translate national plans into local action. Their contribution ensures the NN-LTP reflects the lived realities of the people it aims to serve.", "framing_sw": "KWA NINI SAUTI YAKO NI MUHIMU: AZAKI huhamasisha jamii, huwafikia walio katika mazingira hatarishi zaidi, huwawajibisha wenye wajibu na kubadilisha mipango ya kitaifa kuwa hatua za ngazi ya jamii. Mchango wao unahakikisha NN-LTP inaakisi hali halisi ya maisha ld the plan balance external financing against a credible trajectory of increasing domestic investment in nutrition?", "sw": "Mpango unapaswa kuweka uwiano gani kati ya ufadhili wa nje na mwelekeo unaoaminika wa kuongeza uwekezaji wa ndani katika lishe?"}, {"no": 6, "en": "What would partners need to see in the plan's financing framework to confidently make longer-term commitments?", "sw": "Washirika wangehitaji kuona nini katika mfumo wa ufadhili wa mpango ili wawe na ujasiri wa kutoa ahadi za muda mrefu zaidi?"}], "is_open_header": false}, {"header_en": "C. Technical Priorities", "header_sw": "C. Vipaumbele vya Kitaalamu", "questions": [{"no": 7, "en": "From your global and regional experience, which high-impact interventions or innovations should Tanzania position itself to adopt over the next decade?", "sw": "Kutokana na uzoefu wako wa kimataifa na kikanda, ni afua au ubunifu gani wenye athari kubwa ambao Tanzania inapaswa kujiandaa kuukubali katika muongo ujao?"}, {"no": 8, "en": "Where do you see the biggest capability gaps in Tanzania's nutrition delivery systems that partner support should target?", "sw": "Ni wapi unaona mapungufu makubwa zaidi ya uwezo katika mifumo ya utoaji huduma za lishe nchini Tanzania ambayo msaada wa washirika unapaswa kulenga?"}], "is_open_header": false}, {"header_en": "D. Results and Mutual Accountability", "header_sw": "D. Matokeo na Uwajibikaji wa Pamoja", "questions": [{"no": 9, "en": "What shared results framework and milestone structure would allow both government and partners to be held accountable?", "sw": "Ni mfumo gani wa pamoja wa matokeo na muundo wa hatua muhimu utakaowezesha serikali na washirika kuwajibishwa?"}, {"no": 10, "en": "How should the plan handle partner transitions and exits so that gains are not lost when programmes close?", "sw": "Mpango ushughulikieje mabadiliko na kuondoka kwa washirika ili mafanikio yasipotee programu zinapofungwa?"}], "is_open_header": false}, {"header_en": "E. Risk Management", "hea ulaji wenye afya.", "resp_fields": [{"en": "Institution / Network / Organisation:", "sw": "Taasisi / Mtandao / Shirika:"}, {"en": "Region / Council (if applicable):", "sw": "Mkoa / Halmashauri (ikiwa inahusika):"}, {"en": "Name and title of lead respondent:", "sw": "Jina na cheo cha mtoa majibu mkuu:"}, {"en": "Contact (phone / email):", "sw": "Mawasiliano (simu / barua pepe):"}], "sections": [{"header_en": "A. Menus and Healthy Offerings", "header_sw": "A. Menyu na Chaguo zenye Afya", "questions": [{"no": 1, "en": "What prevents hotels, restaurants and caterers from offering more healthy menu options (cost, demand, skills, supply of ingredients)?", "sw": "Ni nini kinachozuia hoteli, migahawa na watoa huduma za upishi kutoa chaguo zaidi za menyu zenye afya, gharama, mahitaji, ujuzi au upatikanaji wa viambato?"}, {"no": 2, "en": "How is customer demand for healthy eating changing, and in which market segments (tourists, business clients, urban middle class, everyday customers)?", "sw": "Mahitaji ya wateja kuhusu ulaji wenye afya yanabadilikaje, na katika sehemu zipi za soko, watalii, wateja wa biashara, tabaka la kati la mijini na wateja wa kawaida?"}, {"no": 3, "en": "What practical menu and portion changes could the food service sector adopt widely (less salt and oil, more vegetables, healthier cooking methods) without losing customers?", "sw": "Ni mabadiliko gani ya vitendo katika menyu na ukubwa wa mgao ambayo sekta ya huduma za chakula inaweza kuyatumia kwa upana, chumvi na mafuta kidogo, mboga zaidi na mbinu bora za kupika, bila kupoteza wateja?"}], "is_open_header": false}, {"header_en": "B. Sourcing and Local Value Chains", "header_sw": "B. Ununuzi wa Malighafi na Minyororo ya Thamani ya Ndani", "questions": [{"no": 4, "en": "What stops food service businesses from sourcing more fresh, local, nutritious ingredients (reliability, quality, safety, price)?", "sw": "Ni nini kinachozuia biashara za huduma za chakula kununua zaidi viambato safi, vya ndani na vyenye "questions": [{"no": 10, "en": "What voluntary commitments (healthy menu labelling, reduced salt and sugar in preparation, staff nutrition training) could sector associations champion in the first five years of the NN-LTP?", "sw": "Ni ahadi zipi za hiari, uwekaji lebo za menyu zenye afya, kupunguza chumvi na sukari katika maandalizi na mafunzo ya lishe kwa wafanyakazi, ambazo vyama vya sekta vinaweza kuongoza katika miaka mitano ya kwanza ya NN-LTP?"}], "is_open_header": false}, {"header_en": "F. Any other contribution, concern or proposal you wish the NN-LTP drafting team to consider", "header_sw": "F. Mchango, hoja, wasiwasi au pendekezo jingine lolote ambalo ungependa timu ya uandishi ya NN-LTP izingatie", "questions": [], "is_open_header": true}], "closing_en": "Thank you for your contribution. Return the completed template to the National Facilitator through TFNC within 10 working days.", "closing_sw": "Asante kwa mchango wako. Rejesha kiolezo kilichokamilishwa kwa Mwezeshaji wa Kitaifa kupitia TFNC ndani ya siku 10 za kazi."}, "ps6": {"title_en": "NN-LTP 2026-2050 STAKEHOLDER CONSULTATION | PRIVATE SECTOR: BANKS, MICROFINANCE, INSURERS AND IMPACT INVESTORS", "title_sw": "MASHAURIANO NA WADAU YA NN-LTP 2026-2050 | SEKTA BINAFSI: BENKI, HUDUMA NDOGO ZA FEDHA, BIMA NA WAWEKEZAJI WENYE ATHARI CHANYA", "framing_en": "WHY YOUR VOICE MATTERS: Financial institutions decide which food system businesses get capital and on what terms. Without finance flowing to nutritious food value chains, the production, processing and retail changes the plan needs will not happen at scale.", "framing_sw": "KWA NINI SAUTI YAKO NI MUHIMU: Taasisi za fedha huamua ni biashara zipi za mifumo ya chakula zinapata mtaji na kwa masharti gani. Bila fedha kuelekezwa kwenye minyororo ya thamani ya chakula chenye lishe, mabadiliko ya uzalishaji, usindikaji na rejareja yanayohitajika na mpango hayatatokea kwa kiwango kikubwa.", "resp_fields": [{"en": "Institution / Network / Organisation:", "sw": "Taasisi / Mtandao / Shirika:"}, {"en": "Region / Council (if applicable):", "sw": "Mkoa / Halmashauri (ikiwa inahusika):"}, {"en": "Name and title of lead respondent:", "sw": "Jina na cheo cha mtoa majibu mkuu:"}, {"en": "Contact (phone / email):", "sw": "Mawasiliano (simu / barua pepe):"}], "sections": [{"header_en": "A. Current Lending Landscape", "header_sw": "A. Hali ya Sasa ya Utoaji Mikopo", "questions": [{"no": 1, "en": "How do financial institutions currently view lending to agriculture and food businesses, and where do nutritious food value chains fit in that risk picture?", "sw": "Taasisi za fedha kwa sasa zinaionaje mikopo kwa kilimo na biashara za chakula, na minyororo ya thamani ya chakula chenye lishe iko wapi katika tathmini hiyo ya hatari?"}, {"no": 2, "en": "Which segments (smallholders, SME processors, women- and youth-led food enterprises, cold chain operators) are least served by current financial products, and why?", "sw": "Ni makundi gani, wakulima wadogo, wasindikaji wa biashara ndogo na za kati, biashara za chakula zinazoongozwa na wanawake au vijana na waendeshaji wa mnyororo baridi, yanayohudumiwa kwa kiwango kidogo zaidi na bidhaa za sasa za kifedha, na kwa nini?"}], "is_open_header": false}, {"header_en": "B. Products and De-Risking", "header_sw": "B. Bidhaa za Fedha na Kupunguza Hatari", "questions": [{"no": 3, "en": "What financial products (value chain finance, warehouse receipts, leasing for processing and cold chain equipment, insurance) are most promising for nutritious food businesses in Tanzania?", "sw": "Ni bidhaa zipi za kifedha, fedha za mnyororo wa thamani, stakabadhi za ghala, ukodishaji wa vifaa vya usindikaji na mnyororo baridi na bima, zenye matumaini makubwa zaidi kwa biashara za chakula chenye lishe nchini Tanzania?"}, {"no": 4, "en": "What de-risking instruments (guarantees, blended finance, first-loss facilities) would meaningfully shift capital toward nutrition-relevant investments, and who should provide them?", "sw": "Ni zana zipi za kupunguza hatari, dhamana, fedha mseto na mifumo ya kufidia hasara ya kwanza, zitakazohamisha kwa maana mtaji kuelekea uwekezaji unaohusiana na lishe, na nani anapaswa kuzitoa?"}, {"no": 5, "en": "What lessons from existing agricultural finance schemes and partnerships (including bank-led platforms with government or development partners) should the NN-LTP build on?", "sw": "Ni mafunzo gani kutoka mipango na ushirikiano uliopo wa fedha za kilimo, ikiwemo majukwaa yanayoongozwa na benki kwa kushirikiana na serikali au washirika wa maendeleo, ambayo NN-LTP inapaswa kujenga juu yake?"}], "is_open_header": false}, {"header_en": "C. Nutrition as an Investment Theme", "header_sw": "C. Lishe kama Eneo la Uwekezaji", "questions": [{"no": 6, "en": "Could nutrition-smart criteria be integrated into lending and investment screening, and what data or metrics would institutions need to do this credibly?", "sw": "Je, vigezo vinavyozingatia lishe vinaweza kuingizwa katika uchunguzi wa mikopo na uwekezaji, na taasisi zingehitaji data au vipimo gani kufanya hivyo kwa uaminifu?"}, {"no": 7, "en": "What would make Tanzania an attractive destination for impact investment in food and nutrition over the next decade?", "sw": "Ni nini kingeifanya Tanzania kuwa kivutio kwa uwekezaji wenye athari katika chakula na lishe katika muongo ujao?"}], "is_open_header": false}, {"header_en": "D. Partnership with the Plan", "header_sw": "D. Ushirikiano na Mpango", "questions": [{"no": 8, "en": "What role should the financial sector play in the NN-LTP financing framework, alongside government budgets and development partner funds?", "sw": "Sekta ya fedha inapaswa kuwa na jukumu gani katika mfumo wa ufadhili wa NN-LTP sambamba na bajeti za serikali na fedha za washirika wa maendeleo?"}, {"no": 9, "en": "What specific commitment (a lending target, a product launch, a technical partnership) could your institution or association consider for the plan's first five years?", "sw": "Ni ahadi gani mahususi, lengo la mikopo, uzinduzi wa bidhaa au ushirikiano wa kitaalamu, ambayo taasisi au chama chako kinaweza kuzingatia kwa miaka mitano ya kwanza ya mpango?"}], "is_open_header": false}, {"header_en": "F. Any other contribution, concern or proposal you wish the NN-LTP drafting team to consider", "header_sw": "F. Mchango, hoja, wasiwasi au pendekezo jingine lolote ambalo ungependa timu ya uandishi ya NN-LTP izingatie", "questions": [], "is_open_header": true}], "closing_en": "Thank you for your contribution. Return the completed template to the National Facilitator through TFNC within 10 working days.", "closing_sw": "Asante kwa mchango wako. Rejesha kiolezo kilichokamilishwa kwa Mwezeshaji wa Kitaifa kupitia TFNC ndani ya siku 10 za kazi."}, "ps7": {"title_en": "NN-LTP 2026-2050 STAKEHOLDER CONSULTATION | PRIVATE SECTOR: MEDIA, TELECOMMUNICATIONS AND COMMUNICATION INDUSTRY (BROADCASTERS, PRESS, TELECOMS, DIGITAL PLATFORMS AND ADVERTISING)", "title_sw": "MASHAURIANO NA WADAU YA NN-LTP 2026-2050 | SEKTA BINAFSI: VYOMBO VYA HABARI, MAWASILIANO YA SIMU NA SEKTA YA MAWASILIANO (UTANGAZAJI, MAGAZETI, MITANDAO YA SIMU, MAJUKWAA YA KIDIJITALI NA MATANGAZO)", "framing_en": "WHY YOUR VOICE MATTERS: Radio, television, newspapers, telecom operators, digital platforms and advertising agencies shape what Tanzanians know, believe and desire about food. Over 25 years, the battle for healthy diets will be won or lost as much on airwaves and phone screens as in clinics and farms.", "framing_sw": "KWA NINI SAUTI YAKO NI MUHIMU: Redio, televisheni, magazeti, waendeshaji wa mawasiliano ya simu, majukwaa ya kidijitali na mashirika ya matangazo huathiri kile Watanzania wanachojua, wanachoamini na wanachotamani kuhusu chakula. Katika miaka 25, mapambano ya ulaji wenye afya yatashinda au kushindwa katika mawimbi ya habari na skrini za simu kwa kiwango sawa na kliniki na mashamba.", "resp_fields": [{"en": "Institution / Network / Organisation:", "sw": "Taasisi / Mtandao / Shirika:"}, {"en": "Region / Council (if applicable):", "sw": "Mkoa / Halmashauri (ikiwa inahusika):"}, {"en": "Name and title of lead respondent:", "sw": "Jina na cheo cha mtoa majibu mkuu:"}, {"en": "Contact (phone / email):", "sw": "Mawasiliano (simu / barua pepe):"}], "sections": [{"header_en": "A. The Information Environment", "header_sw": "A. Mazingira ya Taarifa", "questions": [{"no": 1, "en": "How is the media and advertising environment currently shaping food choices in Tanzania, and whose voices dominate (commercial brands, influencers, health authorities)?", "sw": "Mazingira ya vyombo vya habari na matangazo kwa sasa yanaathirije uchaguzi wa chakula nchini Tanzania, na sauti za nani zinatawala, chapa za kibiashara, washawishi au mamlaka za afya?"}, {"no": 2, "en": "What nutrition misinformation circulates most in your channels and platforms, and what mechanisms could counter it credibly?", "sw": "Ni taarifa zipi potofu kuhusu lishe zinazosambaa zaidi katika njia na majukwaa yenu, na ni mifumo gani inayoweza kuzikabili kwa uaminifu?"}, {"no": 3, "en": "How do you see the media landscape evolving to 2050 (digital, social media, vernacular content), and what does that mean for reaching households with nutrition messages?", "sw": "Unaonaje mazingira ya vyombo vya habari yakibadilika hadi 2050, kidijitali, mitandao ya kijamii na maudhui ya lugha za wenyeji, na hilo lina maana gani kwa kufikia kaya kwa ujumbe wa lishe?"}], "is_open_header": false}, {"header_en": "B. Responsible Advertising and Content", "header_sw": "B. Matangazo na Maudhui yenye Uwajibikaji", "questions": [{"no": 4, "en": "What advertising standards is the industry prepared to adopt for foods and beverages high in sugar, salt and fat, especially content reaching children and adolescents?", "sw": "Ni viwango gani vya matangazo ambavyo sekta iko tayari kutumia kwa vyakula na vinywaji vyenye sukari, chumvi na mafuta mengi, hasa maudhui yanayowafikia watoto na vijana balehe?"}, {"no": 5, "en": "How can advertising creativity, which currently sells sugary and processed products so effectively, be harnessed to make nutritious foods aspirational?", "sw": "Ubunifu wa matangazo, ambao kwa sasa huuza kwa ufanisi mkubwa bidhaa zenye sukari na zilizosindikwa, unaweza kutumikaje kufanya vyakula vyenye lishe vitamanike?"}, {"no": 6, "en": "What editorial commitments (airtime for nutrition programming, trained health journalists, fact-checking desks) could media houses make under the plan?", "sw": "Ni ahadi zipi za uhariri, muda wa matangazo kwa programu za lishe, waandishi wa habari za afya waliofunzwa na madawati ya uhakiki wa ukweli, ambazo vyombo vya habari vinaweza kutoa chini ya mpango?"}], "is_open_header": false}, {"header_en": "C. Telecom and Digital Platforms", "header_sw": "C. Mawasiliano ya Simu na Majukwaa ya Kidijitali", "questions": [{"no": 7, "en": "How can mobile networks and digital platforms support nutrition goals at scale (SMS and USSD campaigns, mobile counselling, data for surveillance, zero-rated health content)?", "sw": "Mitandao ya simu na majukwaa ya kidijitali yanawezaje kusaidia malengo ya lishe kwa kiwango kikubwa, kampeni za SMS na USSD, ushauri kwa simu, data za ufuatiliaji na maudhui ya afya yasiyotozwa data?"}, {"no": 8, "en": "What partnerships between telecoms and the health system (e.g. m-health services, digital registries, airtime-based incentives) are commercially realistic over the plan period?", "sw": "Ni ushirikiano gani kati ya kampuni za mawasiliano na mfumo wa afya, huduma za afya kwa simu, sajili za kidijitali na vivutio vinavyotegemea muda wa maongezi, unaowezekana kibiashara katika kipindi cha mpango?"}, {"no": 9, "en": "What data and analytics that your networks generate (market trends, mobility, mobile money) could ethically inform nutrition planning, and under what safeguards?", "sw": "Ni data na uchambuzi gani unaozalishwa na mitandao yenu, mwelekeo wa soko, uhamaji na fedha kwa simu, unaoweza kwa maadili kuongoza upangaji wa lishe, na chini ya hatua zipi za ulinzi?"}], "is_open_header": false}, {"header_en": "D. Capacity and Partnership", "header_sw": "D. Uwezo na Ushirikiano", "questions": [{"no": 10, "en": "What would it take to build a cadre of journalists and content creators who report on nutrition accurately and compellingly?", "sw": "Ni nini kinachohitajika kujenga kada ya waandishi wa habari na waundaji wa maudhui wanaoripoti lishe kwa usahihi na kwa mvuto?"}, {"no": 11, "en": "What concrete commitment (free or discounted airtime, a content partnership, an annual media campaign) could your house, network or association make for the first five years of the NN-LTP?", "sw": "Ni ahadi gani mahususi, muda wa matangazo wa bure au uliopunguzwa bei, ushirikiano wa maudhui au kampeni ya kila mwaka ya vyombo vya habari, ambayo chombo, mtandao au chama chako kinaweza kutoa kwa miaka mitano ya kwanza ya NN-LTP?"}], "is_open_header": false}, {"header_en": "F. Any other contribution, concern or proposal you wish the NN-LTP drafting team to consider", "header_sw": "F. Mchango, hoja, wasiwasi au pendekezo jingine lolote ambalo ungependa timu ya uandishi ya NN-LTP izingatie", "questions": [], "is_open_header": true}], "closing_en": "Thank you for your contribution. Return the completed template to the National Facilitator through TFNC within 10 working days.", "closing_sw": "Asante kwa mchango wako. Rejesha kiolezo kilichokamilishwa kwa Mwezeshaji wa Kitaifa kupitia TFNC ndani ya siku 10 za kazi."}, "ps8": {"title_en": "NN-LTP 2026-2050 STAKEHOLDER CONSULTATION | PRIVATE SECTOR APEX ORGANISATIONS (TPSF, CTI, TCCIA AND SECTOR UMBRELLA BODIES)", "title_sw": "MASHAURIANO NA WADAU YA NN-LTP 2026-2050 | MASHIRIKA MWAMVULI YA SEKTA BINAFSI (TPSF, CTI, TCCIA NA MASHIRIKA MWAMVULI YA KISEKTA)", "framing_en": "WHY YOUR VOICE MATTERS: Apex bodies such as the Tanzania Private Sector Foundation (TPSF), Confederation of Tanzania Industries (CTI) and the Tanzania Chamber of Commerce, Industry and Agriculture (TCCIA) speak for thousands of enterprises. They can commit the private sector as a whole, negotiate with government on policy, and hold their members to standards no single firm could impose alone.", "framing_sw": "KWA NINI SAUTI YAKO NI MUHIMU: Mashirika mwamvuli kama Tanzania Private Sector Foundation (TPSF), Confederation of Tanzania Industries (CTI) na Tanzania Chamber of Commerce, Industry and Agriculture (TCCIA) huwakilisha maelfu ya biashara. Yanaweza kutoa ahadi kwa niaba ya sekta binafsi kwa ujumla, kujadiliana na serikali kuhusu sera na kuwawajibisha wanachama wao kwa viwango ambavyo kampuni moja haiwezi kuweka peke yake.", "resp_fields": [{"en": "Institution / Network / Organisation:", "sw": "Taasisi / Mtandao / Shirika:"}, {"en": "Region / Council (if applicable):", "sw": "Mkoa / Halmashauri (ikiwa inahusika):"}, {"en": "Name and title of lead respondent:", "sw": "Jina na cheo cha mtoa majibu mkuu:"}, {"en": "Contact (phone / email):", "sw": "Mawasiliano (simu / barua pepe):"}], "sections": [{"header_en": "A. Representing the Private Sector in the Plan", "header_sw": "A. Uwakilishi wa Sekta Binafsi katika Mpango", "questions": [{"no": 1, "en": "How should the private sector as a whole be formally represented in the governance of the NN-LTP so that engagement is institutional, not personality-driven, across 25 years?", "sw": "Sekta binafsi kwa ujumla iwakilishweje rasmi katika utawala wa NN-LTP ili ushiriki uwe wa kitaasisi na si utegemee watu binafsi katika miaka 25?"}, {"no": 2, "en": "What is the private sector's collective interest in a well-nourished population (workforce productivity, market growth, national competitiveness), and how should the plan articulate this business case?", "sw": "Ni maslahi gani ya pamoja ya sekta binafsi katika kuwa na wananchi wenye lishe bora, tija ya nguvu kazi, ukuaji wa soko na ushindani wa taifa, na mpango uelezeje hoja hii ya kibiashara?"}, {"no": 3, "en": "Which policy dialogues between government and the private sector (e.g. TNBC and sector platforms) should carry a standing nutrition agenda, and how do we get nutrition onto those agendas?", "sw": "Ni majadiliano gani ya sera kati ya serikali na sekta binafsi, kwa mfano TNBC na majukwaa ya kisekta, yanayopaswa kuwa na ajenda ya kudumu ya lishe, na lishe itaingizwaje katika ajenda hizo?"}], "is_open_header": false}, {"header_en": "B. Collective Commitments and Self-Regulation", "header_sw": "B. Ahadi za Pamoja na Kujisimamia", "questions": [{"no": 4, "en": "What collective, time-bound commitments could apex bodies broker across members (fortification compliance, reformulation targets, responsible marketing codes, workforce nutrition programmes)?", "sw": "Ni ahadi zipi za pamoja zenye muda maalumu ambazo mashirika mwamvuli yanaweza kuratibu miongoni mwa wanachama, uzingatiaji wa urutubishaji, malengo ya kubadilisha bidhaa, kanuni za masoko yenye uwajibikaji na programu za lishe kazini?"}, {"no": 5, "en": "How can apex organisations monitor and publicly report their members' delivery on nutrition commitments, and what happens to members who fail to comply?", "sw": "Mashirika mwamvuli yanawezaje kufuatilia na kuripoti hadharani utekelezaji wa ahadi za lishe kwa wanachama wao, na nini kitokee kwa wanachama wasiokidhi wajibu?"}, {"no": 6, "en": "Which industry codes of conduct relevant to nutrition already exist among your members, and how should they be strengthened or extended?", "sw": "Ni kanuni zipi za mwenendo za sekta zinazohusiana na lishe ambazo tayari zipo miongoni mwa wanachama wenu, na zinapaswa kuimarishwa au kupanuliwa vipi?"}], "is_open_header": false}, {"header_en": "C. Policy, Incentives and Investment Climate", "header_sw": "C. Sera, Vivutio na Mazingira ya Uwekezaji", "questions": [{"no": 7, "en": "Which specific policy or regulatory changes would your members accept as fair in exchange for incentives that reward nutritious production (tax measures, procurement preferences, certification)?", "sw": "Ni mabadiliko gani mahususi ya sera au kanuni ambayo wanachama wenu wangekubali kuwa ya haki badala ya vivutio vinavyolipa uzalishaji wenye lishe, hatua za kodi, upendeleo katika ununuzi na vyeti?"}, {"no": 8, "en": "How should the plan address your members' concerns about the cost of compliance (standards, testing, fortification) so that raising quality does not push firms into informality?", "sw": "Mpango ushughulikieje wasiwasi wa wanachama kuhusu gharama za uzingatiaji, viwango, upimaji na urutubishaji, ili kuinua ubora kusiwasukume kampuni katika sekta isiyo rasmi?"}, {"no": 9, "en": "What investment climate reforms would most accelerate private investment into nutritious food value chains, from your members' perspective?", "sw": "Kwa mtazamo wa wanachama wenu, ni mageuzi gani ya mazingira ya uwekezaji yatakayoharakisha zaidi uwekezaji binafsi katika minyororo ya thamani ya chakula chenye lishe?"}], "is_open_header": false}, {"header_en": "D. SMEs, Inclusion and Reach", "header_sw": "D. Biashara Ndogo na za Kati, Ujumuishi na Ufikiaji", "questions": [{"no": 10, "en": "Most food enterprises are SMEs and informal businesses outside apex membership. How can apex bodies extend nutrition standards, training and finance linkages to them?", "sw": "Biashara nyingi za chakula ni biashara ndogo na za kati na biashara zisizo rasmi zilizo nje ya uanachama wa mashirika mwamvuli. Mashirika hayo yanawezaje kuwafikishia viwango vya lishe, mafunzo na uhusiano wa kifedha?"}, {"no": 11, "en": "What role can regional and district chambers play in localising the plan's private sector agenda?", "sw": "Vyumba vya biashara vya mikoa na wilaya vinaweza kuwa na jukumu gani katika kuweka ajenda ya sekta binafsi ya mpango katika mazingira ya eneo husika?"}], "is_open_header": false}, {"header_en": "E. Accountability to the Plan", "header_sw": "E. Uwajibikaji kwa Mpango", "questions": [{"no": 12, "en": "Would your organisation sign a formal compact with government under the NN-LTP, with named commitments reviewed annually, and what should such a compact contain?", "sw": "Je, shirika lako litasaini mkataba rasmi na serikali chini ya NN-LTP wenye ahadi zilizotajwa na kupitiwa kila mwaka, na mkataba huo unapaswa kuwa na nini?"}], "is_open_header": false}, {"header_en": "F. Any other contribution, concern or proposal you wish the NN-LTP drafting team to consider", "header_sw": "F. Mchango, hoja, wasiwasi au pendekezo jingine lolote ambalo ungependa timu ya uandishi ya NN-LTP izingatie", "questions": [], "is_open_header": true}], "closing_en": "Thank you for your contribution. Return the completed template to the National Facilitator through TFNC within 10 working days.", "closing_sw": "Asante kwa mchango wako. Rejesha kiolezo kilichokamilishwa kwa Mwezeshaji wa Kitaifa kupitia TFNC ndani ya siku 10 za kazi."}, "ps9": {"title_en": "NN-LTP 2026-2050 STAKEHOLDER CONSULTATION | FOOD PROCESSORS ASSOCIATIONS AND COOPERATIVES (MILLERS, OIL PROCESSORS, DAIRY, FRUIT AND VEGETABLE PROCESSORS AND THEIR UMBRELLA ASSOCIATIONS)", "title_sw": "MASHAURIANO NA WADAU YA NN-LTP 2026-2050 | VYAMA NA USHIRIKA WA WASINDIKAJI WA CHAKULA (WASAGAJI, WASINDIKAJI WA MAFUTA, MAZIWA, MATUNDA NA MBOGA PAMOJA NA MASHIRIKA YAO MWAMVULI)", "framing_en": "WHY YOUR VOICE MATTERS: Associations of food processors, from grain millers to sunflower oil producers, dairy processors and juice makers, aggregate the small and medium factories that feed most Tanzanian households. Acting through associations is the only realistic way to bring thousands of small processors up to fortification, safety and quality standards.", "framing_sw": "KWA NINI SAUTI YAKO NI MUHIMU: Vyama vya wasindikaji wa chakula, kuanzia wasagaji wa nafaka hadi wazalishaji wa mafuta ya alizeti, wasindikaji wa maziwa na watengenezaji wa juisi, huunganisha viwanda vidogo na vya kati vinavyolisha kaya nyingi za Tanzania. Kufanya kazi kupitia vyama ndiyo njia halisi ya kuwainua maelfu ya wasindikaji wadogo kufikia viwango vya urutubishaji, u blic campaigns would help consumers recognise and choose compliant, nutritious local products?", "sw": "Ni chapa, alama za vyeti au kampeni zipi za umma zitakazowasaidia walaji kutambua na kuchagua bidhaa za ndani zinazokidhi viwango na zenye lishe?"}], "is_open_header": false}, {"header_en": "D. Association Capacity and Commitments", "header_sw": "D. Uwezo wa Chama na Ahadi", "questions": [{"no": 10, "en": "What capacity does your association itself need (staffing, technical expertise, data systems on members) to be a reliable implementation partner for 25 years?", "sw": "Chama chenu chenyewe kinahitaji uwezo gani, watumishi, utaalamu wa kiufundi na mifumo ya data za wanachama, ili kuwa mshirika wa kutegemewa wa utekelezaji kwa miaka 25?"}, {"no": 11, "en": "What specific, measurable commitment could your association make for the plan's first five years (e.g. share of members compliant, number trained, joint testing facility established)?", "sw": "Ni ahadi gani mahususi inayopimika ambayo chama chenu kinaweza kutoa kwa miaka mitano ya kwanza ya mpango, kwa mfano asilimia ya wanachama wanaokidhi viwango, idadi iliyofunzwa au kituo cha pamoja cha upimaji kilichoanzishwa?"}], "is_open_header": false}, {"header_en": "F. Any other contribution, concern or proposal you wish the NN-LTP drafting team to consider", "header_sw": "F. Mchango, hoja, wasiwasi au pendekezo jingine lolote ambalo ungependa timu ya uandishi ya NN-LTP izingatie", "questions": [], "is_open_header": true}], "closing_en": "Thank you for your contribution. Return the completed template to the National Facilitator through TFNC within 10 working days.", "closing_sw": "Asante kwa mchango wako. Rejesha kiolezo kilichokamilishwa kwa Mwezeshaji wa Kitaifa kupitia TFNC ndani ya siku 10 za kazi."}, "youth": {"title_en": "NN-LTP 2026-2050 STAKEHOLDER CONSULTATION | YOUTH NETWORKS AND YOUNG LEADERS", "title_sw": "MASHAURIANO NA WADAU YA NN-LTP 2026-2050 | MITANDAO YA VIJANA NA VIONGOZI VIJANA", "framing_en": "WHY no": 5, "en": "What would enable Members of Parliament to champion nutrition budgets in their committees and constituencies?", "sw": "Ni nini kitakachowawezesha Wabunge kutetea bajeti za lishe katika kamati zao na majimbo yao?"}, {"no": 6, "en": "What is a realistic path for increasing the domestic share of nutrition financing over the plan period, from a parliamentary perspective?", "sw": "Kwa mtazamo wa Bunge, ni njia gani halisi ya kuongeza sehemu ya ufadhili wa lishe kutoka vyanzo vya ndani katika kipindi cha mpango?"}], "is_open_header": false}, {"header_en": "C. Oversight and Accountability", "header_sw": "C. Usimamizi na Uwajibikaji", "questions": [{"no": 7, "en": "What reporting should the executive be required to table in Parliament on NN-LTP progress, and how often?", "sw": "Serikali inapaswa kutakiwa kuwasilisha Bungeni taarifa gani kuhusu maendeleo ya NN-LTP, na mara ngapi?"}, {"no": 8, "en": "How can parliamentary committees (health, agriculture, budget, community development) coordinate their oversight of a multisectoral plan?", "sw": "Kamati za Bunge, afya, kilimo, bajeti na maendeleo ya jamii, zinawezaje kuratibu usimamizi wao wa mpango wa kisekta mbalimbali?"}], "is_open_header": false}, {"header_en": "D. Representation", "header_sw": "D. Uwakilishi", "questions": [{"no": 9, "en": "What are your constituents telling you about food and nutrition that national plans tend to miss?", "sw": "Wananchi wa majimbo yenu wanawaambia nini kuhusu chakula na lishe ambacho mipango ya kitaifa mara nyingi hukikosa?"}, {"no": 10, "en": "How can MPs be equipped with evidence and messages to speak credibly on nutrition in Parliament and at home?", "sw": "Wabunge wanawezaje kupewa ushahidi na ujumbe ili wazungumze kwa uaminifu kuhusu lishe Bungeni na majumbani kwao?"}], "is_open_header": false}, {"header_en": "E. Regional and Global Positioning", "header_sw": "E. Nafasi ya Kikanda na Kimataifa", "questions": [{"no": 11, "en": "How should Tanzania use its parliamentary  phone or email (optional):", "sw": "Mawasiliano, simu au barua pepe (hiari):"}], "sections": [{"header_en": "A. How You Choose Food", "header_sw": "A. Namna Unavyochagua Chakula", "questions": [{"no": 1, "en": "When you buy food, what matters most in your decision (price, taste, safety, freshness, brand, health value), and in what order?", "sw": "Unaponunua chakula, ni mambo gani muhimu zaidi katika uamuzi wako, bei, ladha, usalama, ubichi, chapa au thamani ya kiafya, na kwa mpangilio gani?"}, {"no": 2, "en": "What foods do you buy today that you did not buy five or ten years ago, and what changed (income, availability, advertising, lifestyle)?", "sw": "Ni vyakula gani unavyonunua leo ambavyo hukuvinunua miaka mitano au kumi iliyopita, na ni nini kilichobadilika, kipato, upatikanaji, matangazo au mtindo wa maisha?"}, {"no": 3, "en": "How much do advertisements, radio, TV and social media influence what you and your children ask for and buy?", "sw": "Matangazo, redio, televisheni na mitandao ya kijamii vinaathiri kwa kiwango gani kile ambacho wewe na watoto wako mnaomba na kununua?"}], "is_open_header": false}, {"header_en": "B. Information, Labels and Trust", "header_sw": "B. Taarifa, Lebo na Imani", "questions": [{"no": 4, "en": "Do you read or understand the labels on packaged food and drinks? What would make labels genuinely useful to you?", "sw": "Je, unasoma au kuelewa lebo kwenye vyakula na vinywaji vilivyofungashwa? Ni nini kitakachofanya lebo ziwe na manufaa ya kweli kwako?"}, {"no": 5, "en": "How do you know whether flour or cooking oil you buy is fortified, and would a clear mark or logo change what you pick?", "sw": "Unajuaje kama unga au mafuta ya kupikia unayonunua yamerutubishwa, na alama au nembo iliyo wazi ingebadilisha chaguo lako?"}, {"no": 6, "en": "Whom do you trust for advice on healthy eating (health workers, radio, religious leaders, family, social media), and whom do you not trust?", "sw": "Ni nani unayemwamini kwa ushauri wa ulaji wenye afya, wahudumu wa afya, redio, viongozi wa dini, familia au mitandao ya kijamii, na ni nani usiyemwamini?"}], "is_open_header": false}, {"header_en": "C. Affordability and Access", "header_sw": "C. Uwezo wa Kumudu na Upatikanaji", "questions": [{"no": 7, "en": "Which healthy foods do you want to buy more often but cannot afford, and what do you buy instead?", "sw": "Ni vyakula gani vyenye afya ungependa kununua mara nyingi zaidi lakini huwezi kumudu, na unanunua nini badala yake?"}, {"no": 8, "en": "How do food prices change through the year in your area, and how does your family cope in the expensive months?", "sw": "Bei za chakula hubadilikaje katika mwaka katika eneo lako, na familia yako hukabilianaje na miezi yenye gharama kubwa?"}, {"no": 9, "en": "If healthy foods (vegetables, fruits, beans, eggs, fish, milk) became cheaper, would your household actually buy more of them? What else would need to change?", "sw": "Iwapo vyakula vyenye afya, mboga, matunda, maharage, mayai, samaki na maziwa, vingekuwa nafuu, kaya yako ingenunua zaidi kwa kweli? Ni nini kingine kingehitaji kubadilika?"}], "is_open_header": false}, {"header_en": "D. Safety and Protection", "header_sw": "D. Usalama na Ulinzi", "questions": [{"no": 10, "en": "Have you or your family experienced problems with unsafe food (spoiled, adulterated, badly stored, expired)? What happened and where did you report it, if anywhere?", "sw": "Je, wewe au familia yako mmewahi kukumbana na chakula kisicho salama, kilichoharibika, kuchanganywa na vitu visivyofaa, kuhifadhiwa vibaya au kuisha muda? Nini kilitokea na mliripoti wapi, iwapo mliripoti?"}, {"no": 11, "en": "What protection do you expect from government against unsafe food and misleading claims, and how should you be able to complain and get action?", "sw": "Unatarajia serikali ikulinde vipi dhidi ya chakula kisicho salama na madai ya kupotosha, na unapaswa kuwezaje kulalamika na kupata hatua?"}], "is_open_header": false}, {"header_en": "E. Consumer Voice in the Plan", "header_sw": "E. Sauti ya Walaji katika Mpango", "questions": [{"no": 12, "en": "Should there be a recognised consumer association or platform that speaks for food consumers in national decisions, and would you join or support one?", "sw": "Je, kuwe na chama au jukwaa la walaji linalotambuliwa na kuzungumza kwa niaba ya walaji wa chakula katika maamuzi ya kitaifa, na ungejiunga au kuliunga mkono?"}, {"no": 13, "en": "What one change in the food you can buy would make the biggest difference to your family's health?", "sw": "Ni badiliko gani moja katika chakula unachoweza kununua ambalo lingeleta tofauti kubwa zaidi kwa afya ya familia yako?"}], "is_open_header": false}, {"header_en": "F. Any other contribution, concern or proposal you wish the NN-LTP drafting team to consider", "header_sw": "F. Mchango, hoja, wasiwasi au pendekezo jingine lolote ambalo ungependa timu ya uandishi ya NN-LTP izingatie", "questions": [], "is_open_header": true}], "closing_en": "Thank you for your contribution. Return the completed template to the National Facilitator through TFNC within 10 working days.", "closing_sw": "Asante kwa mchango wako. Rejesha kiolezo kilichokamilishwa kwa Mwezeshaji wa Kitaifa kupitia TFNC ndani ya siku 10 za kazi."}, "community": {"title_en": "NN-LTP 2026-2050 STAKEHOLDER CONSULTATION | COMMUNITY AT LARGE (CITIZENS, HOUSEHOLDS AND LOCAL LEADERS)", "title_sw": "MASHAURIANO NA WADAU YA NN-LTP 2026-2050 | JAMII KWA UJUMLA (WANANCHI, KAYA NA VIONGOZI WA MITAA)", "framing_en": "WHY YOUR VOICE MATTERS: Citizens are the ultimate owners of this plan. Their food choices, care practices and demand for services will decide its success. Their contribution grounds the plan in what families actually experience and want.", "framing_sw": "KWA NINI SAUTI YAKO NI MUHIMU: Wananchi ndio wamiliki wa mwisho wa mpango huu. Uchaguzi wao wa chakula, namna za malezi na mahitaji yao ya huduma vitaamua mafanikio yake. Mchango wao unaweka mpango katika hali halisi ya kile ambacho familia hupitia na kukitaka.", "resp_fields": [{"en": "Region / Council (if applicable):", "sw": "Mkoa / Halmashauri (ikiwa inahusika):"}, {"en": "Your name (optional, only if you would like it recorded):", "sw": "Jina lako (hiari, iwapo ungependa lihifadhiwe):"}, {"en": "Contact, phone or email (optional):", "sw": "Mawasiliano, simu au barua pepe (hiari):"}], "sections": [{"header_en": "A. Daily Realities", "header_sw": "A. Hali Halisi za Kila Siku", "questions": [{"no": 1, "en": "What are the biggest challenges your household faces in putting enough good food on the table throughout the year?", "sw": "Ni changamoto zipi kubwa zaidi ambazo kaya yako hukabili katika kuhakikisha kuna chakula bora cha kutosha mezani mwaka mzima?"}, {"no": 2, "en": "How have food prices, availability and quality changed in your community over the past five to ten years?", "sw": "Bei, upatikanaji na ubora wa chakula vimebadilikaje katika jamii yako katika miaka mitano hadi kumi iliyopita?"}, {"no": 3, "en": "Who in your household or community struggles most with nutrition (young children, pregnant mothers, elders, people with illness), and what help do they need?", "sw": "Ni nani katika kaya au jamii yako anayepambana zaidi na changamoto za lishe, watoto wadogo, wanawake wajawazito, wazee au watu wenye magonjwa, na wanahitaji msaada gani?"}], "is_open_header": false}, {"header_en": "B. Knowledge, Beliefs and Practices", "header_sw": "B. Maarifa, Imani na Mienendo", "questions": [{"no": 4, "en": "Where do you get advice about feeding children and eating well, and whom do you trust most?", "sw": "Unapata wapi ushauri kuhusu kulisha watoto na kula vizuri, na ni nani unayemwamini zaidi?"}, {"no": 5, "en": "Which traditional foods and practices in your community are good for nutrition and should be promoted, and which ones cause harm?", "sw": "Ni vyakula na desturi zipi za asili katika jamii yako zilizo nzuri kwa lishe na zinazopaswa kuhamasishwa, na zipi zina madhara?"}, {"no": 6, "en": "What stops families from following nutrition advice they already know (money, time, customs, men's and women's roles)?", "sw": "Ni nini kinachozuia familia kufuata ushauri wa lishe wanaoujua tayari, fedha, muda, mila au majukumu ya wanaume na wanawake?"}], "is_open_header": false}, {"header_en": "C. Services and Support", "header_sw": "C. Huduma na Msaada", "questions": [{"no": 7, "en": "What nutrition services have you or your family used (clinic counselling, supplements, school meals, support groups), and how would you improve them?", "sw": "Ni huduma zipi za lishe ambazo wewe au familia yako mmetumia, ushauri kliniki, virutubishi vya nyongeza, milo ya shule au vikundi vya msaada, na ungependa ziboreshwe vipi?"}, {"no": 8, "en": "If the government could do one thing in your village or street to improve nutrition, what should it be?", "sw": "Iwapo serikali ingeweza kufanya jambo moja katika kijiji au mtaa wako kuboresha lishe, linapaswa kuwa lipi?"}], "is_open_header": false}, {"header_en": "D. Community Role and Voice", "header_sw": "D. Jukumu na Sauti ya Jamii", "questions": [{"no": 9, "en": "What can the community itself do, with its own hands and resources, to improve nutrition, and what support would unlock that?", "sw": "Jamii yenyewe inaweza kufanya nini kwa nguvu na rasilimali zake kuboresha lishe, na ni msaada gani ungewezesha hilo?"}, {"no": 10, "en": "How should community members be involved in checking whether nutrition services and funds reach the people they are meant for?", "sw": "Wanajamii wahusishweje katika kukagua kama huduma na fedha za lishe zinawafikia watu waliokusudiwa?"}], "is_open_header": false}, {"header_en": "E. Hopes for 2050", "header_sw": "E. Matarajio ya 2050", "questions": [{"no": 11, "en": "When your children and grandchildren are grown, what do you hope will be different about food and health in Tanzania?", "sw": "Watoto na wajukuu zako watakapokuwa watu wazima, unatarajia nini kiwe tofauti kuhusu chakula na afya nchini Tanzania?"}], "is_open_header": false}, {"header_en": "F. Any other contribution, concern or proposal you wish the NN-LTP drafting team to consider", "header_sw": "F. Mchango, hoja, wasiwasi au pendekezo jingine lolote ambalo ungependa timu ya uandishi ya NN-LTP izingatie", "questions": [], "is_open_header": true}], "closing_en": "Thank you for your contribution. Return the completed template to the National Facilitator through TFNC within 10 working days.", "closing_sw": "Asante kwa mchango wako. Rejesha kiolezo kilichokamilishwa kwa Mwezeshaji wa Kitaifa kupitia TFNC ndani ya siku 10 za kazi."}};

ce_label": {"en": "Evidence / examples / references", "sw": "Ushahidi / mifano / marejeo"}, "priority_label": {"en": "Priority", "sw": "Kipaumbele"}, "priority_select": {"en": "Select", "sw": "Chagua"}, "priority_high": {"en": "High", "sw": "Juu"}, "priority_medium": {"en": "Medium", "sw": "Wastani"}, "priority_low": {"en": "Low", "sw": "Chini"}, "response_placeholder": {"en": "Your response", "sw": "Jibu lako"}, "submit_btn": {"en": "Submit contribution", "sw": "Wasilisha mchango"}, "submitting_btn": {"en": "Submitting...", "sw": "Inawasilishwa..."}, "submit_fail": {"en": "Submission failed. Please check your connection and try again.", "sw": "Uwasilishaji umeshindwa. Tafadhali angalia muunganisho wako na ujaribu tena."}, "progress_label": {"en": "{a} of {n} questions answered", "sw": "Maswali {a} kati ya {n} yamejibiwa"}, "confirm_title": {"en": "Thank you for your contribution", "sw": "Asante kwa mchango wako"}, "file_upload_label": {"en": "Supporting document or photo (optional)", "sw": "Nyaraka au picha ya ziada (hiari)"}, "file_upload_hint": {"en": "PDF or photo, up to 15MB. If the file picker does not open here, tap the menu button in your browser and choose Open in Browser or Open in Safari, then try again.", "sw": "PDF au picha, hadi MB 15. Iwapo kichaguzi cha faili hakifunguki hapa, gusa kitufe cha menyu kwenye kivinjari chako na uchague Open in Browser au Open in Safari, kisha ujaribu tena."}, "file_too_large": {"en": "That file is larger than 15MB. Please choose a smaller file or a lower resolution photo.", "sw": "Faili hilo ni kubwa zaidi ya MB 15. Tafadhali chagua faili dogo zaidi au picha yenye ubora wa chini."}};
var CONTEXT = {"purpose": {"text_en": "This tool enables each stakeholder institution or network to contribute systematically to the development of Tanzania's National Nutrition Long-Term Plan (NN-LTP) 2026 to 2050 and the initial Five-Year Nutrition Plan (2026/27 to 2030/31). Each group has questions framed around where that group's own knowledge, mandate and experience add the greatest value.", "text_sw": "Chombo hiki kinawezesha kila taasisi au mtandao wa wadau kuchangia kwa utaratibu katika uandaaji wa Mpango wa Muda Mrefu wa Lishe wa Taifa (NN-LTP) 2026 hadi 2050 na Mpango wa Miaka Mitano wa awali wa Lishe (2026/27 hadi 2030/31). Kila kundi lina maswali yaliyoundwa kulingana na eneo ambalo ujuzi, wajibu na uzoefu wa kundi hilo una manufaa makubwa zaidi."}, "why": {"text_en": "The questions are written from the perspective of each stakeholder group, in plain language, so you can answer from your own mandate and experience rather than react to a generic checklist.", "text_sw": "Maswali yameandikwa kutoka mtazamo wa kila kundi la wadau, kwa lugha rahisi, ili uweze kujibu kutokana na wajibu na uzoefu wako mwenyewe badala ya kujibu orodha ya jumla."}, "how": {"text_en": "Select your stakeholder group above. Read the note explaining why your voice matters to the plan. Answer each question, and be specific with concrete examples where possible. Use the evidence field to reference data, documents or experiences that support your response. Mark how critical you consider each issue using the priority field. If a question is outside your knowledge, write not in our scope rather than leaving it blank.", "text_sw": "Chagua kundi lako la wadau hapo juu. Soma maelezo yanayoeleza kwa nini sauti yako ni muhimu kwa mpango huu. Jibu kila swali, na uwe mahususi ukitumia mifano halisi pale inapowezekana. Tumia sehemu ya ushahidi kurejea data, nyaraka au uzoefu unaothibitisha jibu lako. Onyesha umuhimu wa kila suala kwa kutumia sehemu ya kipaumbele. Iwapo swali liko nje ya ujuzi wako, andika si eneo letu badala ya kuacha wazi."}, "confidentiality": {"text_en": "Responses will be synthesised into the NN-LTP evidence base and consultation record. Individual responses will not be attributed by name without consent. Institutional positions will be attributed to the institution or network.", "text_sw": "Majibu yataunganishwa katika msingi wa ushahidi na kumbukumbu ya mashauriano ya NN-LTP. Majibu binafsi hayatahusishwa na jina bila ridhaa. Misimamo ya kitaasisi itahusishwa na taasisi au mtandao husika."}, "timeline": {"text_en": "Completed responses should be submitted within ten working days of receiving access to this tool, in line with the consultation architecture set out in the NN-LTP Inception Report (May 2026).", "text_sw": "Majibu yaliyokamilika yanapaswa kuwasilishwa ndani ya siku kumi za kazi tangu kupewa ufikiaji wa chombo hiki, kulingana na muundo wa mashauriano uliowekwa katika Ripoti ya Uanzishaji ya NN-LTP (Mei 2026)."}, "contact": {"text_en": "National Facilitator, NN-LTP Development Process, care of Tanzania Food and Nutrition Centre (TFNC), under the strategic oversight of the Prime Minister's Office.", "text_sw": "Mwezeshaji wa Kitaifa, Mchakato wa Uandaaji wa NN-LTP, kupitia Kituo cha Chakula na Lishe Tanzania (TFNC), chini ya usimamizi wa kimkakati wa Ofisi ya Waziri Mkuu."}};

<script>
// ============================================================
// helpers
// ============================================================
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function $(id){ return document.getElementById(id); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

let currentLang = 'en';
let currentKey = null;

function pick(obj, base){ return obj[base + '_' + currentLang]; }
function t(key){ return (UI[key] && UI[key][currentLang]) || key; }

// ============================================================
// logos
// ============================================================
$('logoTfnc').src = LOGO_TFNC;

// ============================================================
// language toggle
// ============================================================
function setLang(lang){
  currentLang = lang;
  $('langEnBtn').classList.toggle('active', lang === 'en');
  $('langSwBtn').classList.toggle('active', lang === 'sw');
  document.documentElement.lang = lang;
  renderStaticChrome();
  renderGroupGrid();
  if(currentKey && $('screen-gate').classList.contains('active')) renderGate(currentKey);
  if(currentKey && $('screen-form').classList.contains('active')) buildForm(currentKey);
}
$('langEnBtn').addEventListener('click', ()=> setLang('en'));
$('langSwBtn').addEventListener('click', ()=> setLang('sw'));

// ============================================================
// static chrome text (re-rendered whenever language changes)
// ============================================================
function renderStaticChrome(){
  $('topbarEyebrow').textContent = t('topbar_eyebrow');
  $('heroTitle').textContent = t('hero_title');
  $('heroSub').textContent = t('hero_sub');
  $('contextToggleLabel').textContent = t('context_toggle');
  $('gateIntro').textContent = t('gate_intro');
  $('gateError').textContent = t('gate_error');
  $('backFromGate').textContent = t('back_link');
  $('backFromForm').textContent = t('back_link');
  $('backFromConfirm').textContent = t('confirm_back');
  $('submitBtn').textContent = t('submit_btn');
  $('confirmTitle').textContent = t('confirm_title');
  $('codeInput').placeholder = t('code_placeholder');
  renderContextPanel();
}

function renderContextPanel(){
  const c = CONTEXT;
  const order = ['purpose','why','how','confidentiality','timeline','contact'];
  let html = '';
  order.forEach(key=>{
    html += `<div class="context-block">
      <h3>${esc(t('context_'+key+'_label'))}</h3>
      <p>${esc(pick(c[key], 'text'))}</p>
    </div>`;
  });
  $('contextInner').innerHTML = html;
}

let contextOpen = false;
$('contextToggle').addEventListener('click', ()=>{
  contextOpen = !contextOpen;
  $('contextToggle').classList.toggle('open', contextOpen);
  $('contextPanel').classList.toggle('open', contextOpen);
});

// ============================================================
// SCREEN 1: build the selector grid (language-aware)
// ============================================================
function renderGroupGrid(){
  const grid = $('groupGrid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const label = document.createElement('div');
    label.className = 'cat-label';
    label.textContent = pick(cat, 'label');
    grid.appendChild(label);

    const row = document.createElement('div');
    row.className = 'grid';
    cat.keys.forEach(key=>{
      const g = DATA[key];
      const isOpen = !CODES[key];
      const card = document.createElement('div');
      card.className = 'card' + (isOpen ? ' is-open' : '');
      const shortTitle = titleShort(pick(g, 'title'));
      const iconSvg = isOpen
        ? '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2a5 5 0 00-5 5v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8a2 2 0 00-2-2h-1V7a5 5 0 00-5-5zm3 8H9V7a3 3 0 016 0v3z" fill="#FFFFFF"/></svg>'
        : '';
      card.innerHTML = `
        ${isOpen ? `<div class="card-icon">${iconSvg}</div>` : ''}
        <div class="name-en">${esc(shortTitle)}</div>
        <div class="meta">${isOpen
          ? '<span class="open-badge">&#9679; ' + esc(t('open_badge')) + '</span>'
          : '<span class="lock-badge">&#128274; ' + esc(t('lock_badge')) + '</span>'}</div>
      `;
      card.addEventListener('click', ()=> selectGroup(key));
      row.appendChild(card);
    });
    grid.appendChild(row);
  });
}
function titleShort(t){ const parts = t.split('|'); return parts[1] ? parts[1].trim() : t; }

// ============================================================
// SCREEN 2: code gate
// ============================================================
function selectGroup(key){
  currentKey = key;
  const code = CODES[key];
  if(!code){
    buildForm(key);
    showScreen('screen-form');
  } else {
    renderGate(key);
    showScreen('screen-gate');
    setTimeout(()=>$('codeInput').focus(), 200);
  }
}
function renderGate(key){
  $('gateName').textContent = titleShort(pick(DATA[key], 'title'));
  $('codeInput').value = '';
  $('gateError').style.display = 'none';
}

$('backFromGate').addEventListener('click', ()=> showScreen('screen-select'));
$('backFromForm').addEventListener('click', ()=> showScreen('screen-select'));
$('backFromConfirm').addEventListener('click', ()=> showScreen('screen-select'));

$('codeInput').addEventListener('keydown', e=>{ if(e.key === 'Enter') checkCode(); });
function checkCode(){
  const entered = $('codeInput').value.trim().toUpperCase();
  const expected = CODES[currentKey];
  if(entered === expected){
    buildForm(currentKey);
    showScreen('screen-form');
  } else {
    $('gateError').style.display = 'block';
  }
}
(function addGateButton(){
  const wrap = document.querySelector('.gate-wrap');
  const btn = document.createElement('button');
  btn.id = 'gateUnlockBtn';
  btn.className = 'submit';
  btn.type = 'button';
  btn.style.marginTop = '18px';
  btn.addEventListener('click', checkCode);
  wrap.insertBefore(btn, $('gateError'));
})();
function updateGateButtonLabel(){ $('gateUnlockBtn').textContent = t('gate_unlock_btn'); }

// ============================================================
// SCREEN 3: build the form for a given group (language-aware)
// ============================================================
function buildForm(key){
  const g = DATA[key];

  $('formHead').innerHTML = `
    <h1>${esc(titleShort(pick(g,'title')))}</h1>
    <div class="framing">
      <span class="label">${esc(t('why_matters_label'))}</span>
      <p>${esc(pick(g,'framing').replace(/^[^:]*:\s*/,''))}</p>
    </div>
  `;

  const rb = $('respondentBlock');
  rb.innerHTML = `<div class="cat-label" style="margin-top:0;">${esc(t('respondent_info_label'))}</div>`;
  const rowsWrap = document.createElement('div');
  for(let i=0;i<g.resp_fields.length;i+=2){
    const row = document.createElement('div');
    row.className = 'field-row';
    for(let j=i;j<Math.min(i+2, g.resp_fields.length);j++){
      const f = g.resp_fields[j];
      const div = document.createElement('div');
      div.className = 'field';
      const labelText = (currentLang === 'en' ? f.en : f.sw).replace(/:\s*$/,'');
      div.innerHTML = `<label>${esc(labelText)}</label><input type="text" data-resp="${j}">`;
      row.appendChild(div);
    }
    rowsWrap.appendChild(row);
  }
  rb.appendChild(rowsWrap);

  const container = $('sectionsContainer');
  container.innerHTML = '';
  let qCounter = 0;

  g.sections.forEach(section=>{
    const secHead = document.createElement('div');
    secHead.className = 'section-head';
    secHead.textContent = pick(section, 'header').trim();
    container.appendChild(secHead);

    if(section.is_open_header){
      qCounter++;
      container.appendChild(buildQCard(null, pick(section,'header'), `open_${section.header_en.slice(0,10)}`, true));
    } else {
      section.questions.forEach(q=>{
        qCounter++;
        const qtext = currentLang === 'en' ? q.en : q.sw;
        container.appendChild(buildQCard(q.no, qtext, `q${q.no}`, false));
      });
    }
  });

  function buildQCard(num, text, fieldKey, isFinal){
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = `
      <div class="qtext-en"><span class="qnum">${num ? num + '.' : ''}</span>${esc(text)}</div>
      <textarea data-field="${fieldKey}_response" placeholder="${esc(t('response_placeholder'))}"></textarea>
      ${isFinal ? '' : `
      <div class="qsub-row">
        <div class="field">
          <label>${esc(t('evidence_label'))}</label>
          <input type="text" data-field="${fieldKey}_evidence">
        </div>
        <div class="field">
          <label>${esc(t('priority_label'))}</label>
          <select data-field="${fieldKey}_priority">
            <option value="">${esc(t('priority_select'))}</option>
            <option value="High">${esc(t('priority_high'))}</option>
            <option value="Medium">${esc(t('priority_medium'))}</option>
            <option value="Low">${esc(t('priority_low'))}</option>
          </select>
        </div>
      </div>`}
    `;
    return card;
  }

  $('closingBox').textContent = pick(g, 'closing');

  const evidenceBlock = $('evidenceUploadBlock');
  evidenceBlock.innerHTML = `
    <div class="respondent-block" style="margin-top:20px;">
      <div class="field">
        <label>${esc(t('file_upload_label'))}</label>
        <input type="file" id="evidenceFile" accept="application/pdf,image/*">
        <div style="font-size:11.5px;color:var(--muted);margin-top:6px;">${esc(t('file_upload_hint'))}</div>
        <div class="gate-error" id="fileError" style="display:none;margin-top:8px;"></div>
      </div>
    </div>
  `;
  $('evidenceFile').addEventListener('change', function(){
    const err = $('fileError');
    err.style.display = 'none';
    if(this.files && this.files[0]){
      const sizeMB = this.files[0].size / (1024*1024);
      if(sizeMB > 15){
        err.textContent = t('file_too_large');
        err.style.display = 'block';
        this.value = '';
      }
    }
  });

  container.querySelectorAll('textarea, input[type=text], select').forEach(el=>{
    el.addEventListener('input', updateProgress);
    el.addEventListener('change', updateProgress);
  });
  updateProgress();

  $('statusBox').className = 'status';
  $('submitBtn').disabled = false;
  $('submitBtn').textContent = t('submit_btn');
  renderStaticChrome();
  updateGateButtonLabel();
}

function updateProgress(){
  const container = $('sectionsContainer');
  const responseAreas = container.querySelectorAll('textarea');
  let answered = 0;
  responseAreas.forEach(ta=>{ if(ta.value.trim() !== '') answered++; });
  const pct = responseAreas.length ? Math.round(answered/responseAreas.length*100) : 0;
  $('progressFill').style.width = pct + '%';
  const tmpl = t('progress_label');
  $('progressLabel').textContent = tmpl.replace('{a}', answered).replace('{n}', responseAreas.length);
}

// ============================================================
// submit
// ============================================================
$('qForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const g = DATA[currentKey];
  const btn = $('submitBtn');
  const status = $('statusBox');

  const formData = new FormData();
  formData.append('Stakeholder_Group', titleShort(g.title_en));
  formData.append('Stakeholder_Group_Key', currentKey);
  formData.append('Response_Language', currentLang);
  formData.append('Date_Completed', new Date().toISOString().slice(0,10));
  formData.append('Time_Completed', new Date().toTimeString().slice(0,8));
  formData.append('Mode', 'Online form (this tool)');
  formData.append('Created', 'x-sheetmonkey-current-date-time');

  document.querySelectorAll('#respondentBlock input[data-resp]').forEach(inp=>{
    const idx = inp.getAttribute('data-resp');
    const label = g.resp_fields[idx].en.replace(/:\s*$/,'').replace(/\s*\(optional.*?\)/i,'');
    formData.append('Respondent_' + label.replace(/[^a-zA-Z0-9]+/g,'_'), inp.value);
  });
  document.querySelectorAll('#sectionsContainer [data-field]').forEach(inp=>{
    formData.append(inp.getAttribute('data-field'), inp.value);
  });
  const fileInput = $('evidenceFile');
  if(fileInput && fileInput.files && fileInput.files[0]){
    formData.append('Evidence_File', fileInput.files[0], fileInput.files[0].name);
  }

  btn.disabled = true; btn.textContent = t('submitting_btn');
  status.className = 'status';

  try{
    const resp = await fetch(SHEETMONKEY_URL, { method:'POST', body: formData });
    if(resp.ok){
      $('confirmClosing').textContent = pick(g, 'closing');
      showScreen('screen-confirm');
      this.reset();
    } else {
      status.className = 'status err';
      status.textContent = t('submit_fail');
    }
  } catch(err){
    status.className = 'status err';
    status.textContent = t('submit_fail');
  }
  btn.disabled = false; btn.textContent = t('submit_btn');
});

// ============================================================
// init
// ============================================================
setLang('en');

</script>
</body>
</html>
