<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NN-LTP 2026-2050 Stakeholder Consultation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1B4332; --green-deep:#122E22; --green-soft:#2D6A4F;
  --gold:#D4A94F; --gold-soft:#E8CD8A;
  --paper:#FAF8F3; --panel:#FFFFFF; --ink:#22292F; --muted:#6B7060;
  --rust:#B54834; --line:#E3DFD3;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Source Serif 4',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ---------- shell ---------- */
.app{max-width:900px;margin:0 auto;padding:0 24px 80px;min-height:100vh;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
  padding:20px 0;border-bottom:2px solid var(--green);margin-bottom:8px;
}
.brand{display:flex;align-items:center;gap:16px;}
.brand img.logo{height:42px;width:auto;object-fit:contain;}
.brand .divider{width:1px;height:34px;background:var(--line);}
.brand-text{line-height:1.25;}
.brand-text .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--green-soft);}
.brand-text .title{font-family:'Source Serif 4',serif;font-weight:600;font-size:15px;color:var(--green-deep);}

.topbar-right{display:flex;align-items:center;gap:14px;}
.lang-toggle{display:flex;border:1.5px solid var(--green);border-radius:20px;overflow:hidden;}
.lang-toggle button{
  border:none;background:var(--panel);color:var(--green-deep);font-family:'IBM Plex Mono',monospace;
  font-size:12px;font-weight:600;padding:7px 16px;cursor:pointer;transition:background .15s,color .15s;
}
.lang-toggle button.active{background:var(--green);color:#fff;}

/* ---------- screens ---------- */
.screen{display:none;animation:fadein .25s ease;}
.screen.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ---------- hero / selector ---------- */
.hero{padding:34px 0 8px;text-align:left;}
.hero h1{font-family:'Source Serif 4',serif;font-weight:600;font-size:clamp(24px,4vw,34px);color:var(--green-deep);margin:0 0 10px;letter-spacing:-.01em;}
.hero .sub{font-size:14.5px;color:var(--muted);max-width:640px;margin:0;}

/* ---------- context panel ---------- */
.context-toggle{
  display:inline-flex;align-items:center;gap:7px;margin:18px 0 6px;padding:9px 16px;
  background:var(--panel);border:1.5px solid var(--gold);border-radius:20px;cursor:pointer;
  font-size:12.5px;font-weight:600;color:var(--green-deep);
}
.context-toggle .arrow{transition:transform .2s;}
.context-toggle.open .arrow{transform:rotate(180deg);}
.context-panel{
  max-height:0;overflow:hidden;transition:max-height .3s ease;background:var(--panel);
  border-radius:6px;border:1.5px solid var(--line);margin-top:0;
}
.context-panel.open{max-height:1400px;margin-top:14px;}
.context-inner{padding:22px 24px;}
.context-block{margin-bottom:18px;}
.context-block:last-child{margin-bottom:0;}
.context-block h3{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);margin:0 0 6px;
}
.context-block p{font-size:13.5px;color:var(--ink);margin:0;line-height:1.6;}

.cat-label{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);margin:30px 0 14px;display:flex;align-items:center;gap:10px;
}
.cat-label::after{content:'';flex:1;height:1px;background:var(--line);}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(max-width:640px){.grid{grid-template-columns:1fr;}}
.card{
  background:var(--panel);border:1.5px solid var(--line);border-radius:6px;
  padding:16px 18px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;
  text-align:left;position:relative;
}
.card:hover{border-color:var(--green-soft);transform:translateY(-1px);box-shadow:0 4px 14px rgba(27,67,50,.08);}
.card .name-en{font-family:'Source Serif 4',serif;font-weight:600;font-size:15px;color:var(--green-deep);margin-bottom:8px;}
.card .meta{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);}
.lock-badge{display:inline-flex;align-items:center;gap:4px;color:var(--rust);}
.open-badge{display:inline-flex;align-items:center;gap:4px;color:var(--green-soft);}

.card.is-open{
  border:2px solid var(--gold);background:linear-gradient(180deg,#FFFDF6 0%,var(--panel) 100%);
}
.card.is-open:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(212,169,79,.25);}
.card-icon{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;
}
.card.is-open .card-icon{background:var(--gold);}
.card-icon svg{width:18px;height:18px;}

/* ---------- code gate ---------- */
.gate-wrap{max-width:440px;margin:60px auto 0;text-align:center;}
.gate-seal{
  width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
}
.gate-wrap h2{font-family:'Source Serif 4',serif;font-size:21px;color:var(--green-deep);margin:0 0 20px;}
.gate-wrap p{font-size:13.5px;color:var(--muted);margin-bottom:26px;}
.code-input{
  width:100%;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.35em;
  padding:16px;border:2px solid var(--line);border-radius:6px;background:var(--panel);color:var(--green-deep);
  text-transform:uppercase;
}
.code-input:focus{outline:none;border-color:var(--green-soft);}
.gate-error{color:var(--rust);font-size:13px;margin-top:12px;display:none;}
.back-link{display:inline-block;margin-top:26px;font-size:12.5px;color:var(--muted);cursor:pointer;text-decoration:underline;}

/* ---------- form ---------- */
.form-head{padding:30px 0 18px;border-bottom:2px solid var(--line);margin-bottom:26px;}
.form-head h1{font-family:'Source Serif 4',serif;font-weight:600;font-size:clamp(21px,3vw,27px);color:var(--green-deep);margin:0;}
.framing{background:var(--green-deep);color:var(--paper);border-radius:6px;padding:16px 20px;margin-top:14px;}
.framing .label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-soft);display:block;margin-bottom:6px;}
.framing p{font-size:13.5px;margin:0;line-height:1.55;}

.respondent-block{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:26px;}
.respondent-block .cat-label{margin:0 0 14px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;}
@media(max-width:640px){.field-row{grid-template-columns:1fr;}}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:5px;}
.field input,.field select{
  width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:4px;
  font-family:'Inter',sans-serif;font-size:13.5px;background:var(--panel);color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green-soft);}

.section-head{
  font-family:'Source Serif 4',serif;font-weight:600;font-size:16px;color:var(--green-deep);
  margin:34px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--gold);
}

.qcard{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:14px;}
.qnum{font-family:'IBM Plex Mono',monospace;color:var(--green-soft);font-weight:700;margin-right:6px;}
.qtext-en{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.5;}
.qcard textarea{
  width:100%;min-height:80px;margin-top:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;
  font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);resize:vertical;
}
.qsub-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:10px;}
@media(max-width:640px){.qsub-row{grid-template-columns:1fr;}}
.qsub-row .field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.qsub-row input,.qsub-row select{font-size:13px;}

.choice-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.choice-opt{
  display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:5px;
  cursor:pointer;font-size:13.5px;color:var(--ink);transition:border-color .15s,background .15s;background:var(--panel);
}
.choice-opt:hover{border-color:var(--green-soft);background:#FAFCFB;}
.choice-opt input{margin-top:2px;flex-shrink:0;accent-color:var(--green);width:16px;height:16px;}
.choice-list .other-input{margin-top:2px;}
.qselect-wrap select{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:5px;font-family:'Inter',sans-serif;
  font-size:13.5px;color:var(--ink);background:var(--panel);margin-top:12px;
}
.qselect-wrap .other-input{margin-top:10px;}

.rank-hint{font-size:12px;color:var(--gold);font-weight:600;margin-top:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;}
.rank-list{margin-top:8px;display:flex;flex-direction:column;gap:8px;}
.rank-opt{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--line);border-radius:5px;
  cursor:pointer;background:var(--panel);transition:border-color .15s,background .15s;
}
.rank-opt:hover{border-color:var(--green-soft);}
.rank-opt.ranked{border-color:var(--gold);background:#FFFBF2;}
.rank-opt.rank-disabled{opacity:.4;cursor:not-allowed;}
.rank-badge{
  width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);
}
.rank-opt.ranked .rank-badge{background:var(--gold);border-color:var(--gold);color:#fff;}
.rank-label{font-size:13.5px;color:var(--ink);}



.progress-track{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:16px 0 4px;position:sticky;top:0;}
.progress-fill{height:100%;background:var(--gold);transition:width .2s;}
.progress-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-bottom:20px;}

.draft-banner{background:#FFFDF6;border:2px solid var(--gold);border-radius:6px;padding:14px 18px;margin-bottom:18px;font-size:13px;color:var(--ink);}
.draft-banner .actions{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;}
.draft-banner button{border:1.5px solid var(--green);background:var(--green);color:#fff;padding:7px 14px;border-radius:4px;font-size:12.5px;font-weight:600;cursor:pointer;}
.draft-banner button.discard{background:none;color:var(--rust);border-color:var(--rust);}

.save-progress-bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
button.ghost-save{background:none;border:1.5px solid var(--green);color:var(--green);padding:9px 16px;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
button.ghost-save:hover{background:var(--green);color:#fff;}
.save-status{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}

.closing-box{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:18px 20px;margin-top:24px;font-size:13px;color:var(--muted);}

button.submit{
  width:100%;background:var(--green);color:#fff;border:none;padding:15px;font-size:14.5px;font-weight:600;
  border-radius:6px;cursor:pointer;margin-top:20px;font-family:'Inter',sans-serif;transition:background .15s;
}
button.submit:hover{background:var(--green-deep);}
button.submit:disabled{opacity:.55;cursor:wait;}
.status{padding:12px 16px;border-radius:6px;font-size:13.5px;margin-top:14px;display:none;}
.status.ok{display:block;background:#E8F1EC;color:var(--green-deep);border-left:4px solid var(--green-soft);}
.status.err{display:block;background:#F7E7E3;color:var(--rust);border-left:4px solid var(--rust);}

/* ---------- confirmation ---------- */
.confirm-wrap{max-width:460px;margin:70px auto 0;text-align:center;}
.confirm-wrap .check{width:60px;height:60px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
.confirm-wrap h2{font-family:'Source Serif 4',serif;font-size:22px;color:var(--green-deep);}
.confirm-wrap p{font-size:14px;color:var(--muted);}
.explore-more{
  margin-top:38px;padding:20px 22px;border-radius:10px;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:16px;
  background:linear-gradient(135deg, var(--green-deep) 0%, var(--green) 100%);
  box-shadow:0 4px 18px rgba(18,46,34,.18);transition:transform .15s,box-shadow .15s;
}
.explore-more:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(18,46,34,.26);}
.explore-icon{
  font-size:22px;flex-shrink:0;width:44px;height:44px;border-radius:50%;
  background:rgba(212,169,79,.2);display:flex;align-items:center;justify-content:center;
}
.explore-text{flex:1;min-width:0;}
.explore-title{font-family:'Source Serif 4',serif;font-weight:600;font-size:15px;color:#fff;margin-bottom:4px;}
.explore-sub{font-size:12px;color:rgba(255,255,255,.8);line-height:1.5;}
.explore-arrow{font-size:20px;color:var(--gold);flex-shrink:0;}

</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <img class="logo" id="logoTfnc" alt="Tanzania Food and Nutrition Centre">
    </div>
    <div class="topbar-right">
      <div class="brand-text" style="text-align:right;">
        <div class="eyebrow" id="topbarEyebrow"></div>
        <div class="title">NN-LTP 2026&#8211;2050</div>
      </div>
      <div class="lang-toggle">
        <button id="langEnBtn" class="active">EN</button>
        <button id="langSwBtn">SW</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 1: SELECTOR -->
  <div class="screen active" id="screen-select">
    <div class="hero">
      <h1 id="heroTitle"></h1>
      <p class="sub" id="heroSub"></p>
    </div>

    <div class="context-toggle" id="contextToggle">
      <span id="contextToggleLabel"></span>
      <span class="arrow">&#9660;</span>
    </div>
    <div class="context-panel" id="contextPanel">
      <div class="context-inner" id="contextInner"></div>
    </div>

    <div id="groupGrid"></div>
  </div>

  <!-- SCREEN 2: CODE GATE -->
  <div class="screen" id="screen-gate">
    <div class="gate-wrap">
      <div class="gate-seal">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="10" width="14" height="10" rx="1.5" stroke="#D4A94F" stroke-width="1.6"/><path d="M8 10V7a4 4 0 018 0v3" stroke="#D4A94F" stroke-width="1.6"/></svg>
      </div>
      <h2 id="gateName"></h2>
      <p id="gateIntro"></p>
      <input type="text" class="code-input" id="codeInput" maxlength="12">
      <div class="gate-error" id="gateError"></div>
      <div class="back-link" id="backFromGate"></div>
    </div>
  </div>

  <!-- SCREEN 3: FORM -->
  <div class="screen" id="screen-form">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
    <div id="draftBanner" class="draft-banner" style="display:none;"></div>
    <div class="form-head" id="formHead"></div>
    <div class="respondent-block" id="respondentBlock"></div>
    <div class="save-progress-bar">
      <button type="button" class="ghost-save" id="saveProgressBtn"></button>
      <span id="saveStatus" class="save-status"></span>
    </div>
    <form id="qForm">
      <div id="sectionsContainer"></div>
      <div class="closing-box" id="closingBox"></div>
      <button type="submit" class="submit" id="submitBtn"></button>
      <div class="status" id="statusBox"></div>
    </form>
    <div class="back-link" id="backFromForm"></div>
  </div>

  <!-- SCREEN 4: CONFIRMATION -->
  <div class="screen" id="screen-confirm">
    <div class="confirm-wrap">
      <div class="check"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2 id="confirmTitle"></h2>
      <p id="confirmClosing" style="margin-top:20px;"></p>
      <div class="back-link" id="backFromConfirm"></div>
      <div class="explore-more" id="exploreMoreLink">
        <div class="explore-icon">&#128203;</div>
        <div class="explore-text">
          <div class="explore-title" id="exploreMoreTitle"></div>
          <div class="explore-sub" id="exploreMoreText"></div>
        </div>
        <div class="explore-arrow">&#8594;</div>
      </div>
    </div>
  </div>

</div>
<script>
const SHEETMONKEY_URL = "https://api.sheetmonkey.io/form/hpPzECijwu7exxqMkTVsvx";

in problem", "sw": "Hapana, bei si tatizo kuu"}]}]}, {"header_en": "D. Safety", "header_sw": "D. Usalama", "is_open_header": false, "questions": [{"no": 8, "type": "single_choice", "other": false, "en": "Have you or your family ever bought unsafe food (spoiled, fake or expired)?", "sw": "Je, wewe au familia yako mmewahi kununua chakula kisicho salama (kilichoharibika, bandia au muda wake umepita)?", "options": [{"en": "Yes, more than once", "sw": "Ndiyo, zaidi ya mara moja"}, {"en": "Yes, once", "sw": "Ndiyo, mara moja"}, {"en": "No, never", "sw": "Hapana, kamwe"}, {"en": "Not sure", "sw": "Sina uhakika"}]}]}, {"header_en": "E. In Your Own Words", "header_sw": "E. Kwa Maneno Yako Mwenyewe", "is_open_header": false, "questions": [{"no": 9, "type": "open", "other": false, "en": "What one change in the food you can buy would make the biggest difference to your family's health?", "sw": "Ni mabadiliko gani moja kwenye chakula unachoweza kununua yangeleta tofauti kubwa zaidi kwa afya ya familia yako?", "simple": true}]}, {"header_en": "F. Any other contribution, concern or proposal you wish the NN-LTP drafting team to consider", "header_sw": "F. Mchango, hoja, wasiwasi au pendekezo jingine lolote ambalo ungependa timu ya uandishi ya NN-LTP izingatie", "is_open_header": true, "questions": []}], "closing_en": "Thank you for your contribution. Return the completed template to the National Facilitator through TFNC within 10 working days.", "closing_sw": "Asante kwa mchango wako. Rejesha kiolezo kilichokamilishwa kwa Mwezeshaji wa Kitaifa kupitia TFNC ndani ya siku 10 za kazi."}, "ministries": {"title_en": "NN-LTP 2026-2050 STAKEHOLDER CONSULTATION | NUTRITION SECTOR LINE MINISTRIES", "title_sw": "MASHAURIANO NA WADAU YA NN-LTP 2026-2050 | WIZARA ZA KISEKTA ZENYE UHUSIANO NA LISHE", "framing_en": "WHY YOUR VOICE MATTERS: Nutrition is shaped by decisions made far beyond the health sector. The Ministry of Finance decides how much fiscal space nutrition-relevant programmes get, and can tax or exempt foods that affect what people eat. The Ministry of Foreign Affairs represents Tanzania's international nutrition commitments, including the SUN Movement itself, and negotiates trade agreements that affect food availability and prices. The Ministry of Community Development reaches households directly through social protection and gender programmes. Even ministries that can seem far removed, works and infrastructure, energy, home affairs, defence, justice, education, often touch nutrition through roads that carry food to markets, cooking fuel access, feeding in prisons, barracks or refugee settings, or food safety and labour law. If your ministry has never been asked about nutrition before, this consultation is built to help you find where you actually connect, not to assume you already know.", "framing_sw": "KWA NINI SAUTI YAKO NI MUHIMU: Lishe inaathiriwa na maamuzi yanayofanyika mbali zaidi ya sekta ya afya. Wizara ya Fedha huamua nafasi ya kifedha inayopatikana kwa programu zenye uhusiano na lishe, na inaweza kutoza kodi au kusamehe kodi kwa vyakula vinavyoathiri kile watu wanachokula. Wizara ya Mambo ya Nje inawakilisha ahadi za kimataifa za lishe za Tanzania, ikiwemo uanachama wa Mpango wa SUN wenyewe, na hujadiliana mikataba ya kibiashara inayoathiri upatikanaji na bei za chakula. Wizara ya Maendeleo ya Jamii hufikia kaya moja kwa moja kupitia programu za hifadhi ya jamii na jinsia. Hata wizara zinazoweza kuonekana mbali kabisa, ujenzi na miundombinu, nishati, mambo ya ndani, ulinzi, sheria, elimu, mara nyingi huhusiana na lishe kupitia barabara zinazosafirisha chakula sokoni, upatikanaji wa nishati ya kupikia, ulishaji magerezani, kambini au kwa wakimbizi, au sheria za usalama wa chakula na kazi. Iwapo wizara yako haijawahi kuulizwa kuhusu lishe hapo awali, mashauriano haya yameundwa kukusaidia kupata mahali unapohusiana kwa hakika, si kudhani tayari unajua.", "resp_fields": [{"en": "Ministry:", "sw": "Wizara:"}, {"en": "Department or Division:", "sw": "Idara au Kitengo:"}, {"en": "Name and title of respondent:", "sw": "Jina na cheo cha mtoa majibu:"}, {"en": "Contact (phone / email):", "sw": "Mawasiliano (simu / barua pepe):"}], "sections": [{"header_en": "A. Finding Your Ministry's Connection to Nutrition", "header_sw": "A. Kutafuta Uhusiano wa Wizara Yako na Lishe", "is_open_header": false, "questions": [{"no": 1, "en": "Every ministry connects to nutrition through at least one of the following: budget and financing; regulation, standards or law; data and public communication; infrastructure and services; international relations and trade; workforce and institutions such as schools, barracks, prisons or hospitals; social protection and vulnerable groups; or land and environment. Look through this list and tell us which of these describes something your ministry actually does, and what specifically it is. If more than one applies, describe each.", "sw": "Kila wizara inahusiana na lishe kupitia angalau moja ya haya: bajeti na ufadhili; kanuni, viwango au sheria; data na mawasiliano kwa umma; miundombinu na huduma; mahusiano ya kimataifa na biashara; nguvu kazi na taasisi kama shule, kambi, magereza au hospitali; hifadhi ya jamii na makundi maalum; au ardhi na mazingira. Pitia orodha hii na utuambie ni ipi kati ya hizi inayoelezea jambo ambalo wizara yako inafanya kwa hakika, na ni nini hasa. Iwapo zaidi ya moja inahusika, eleza kila moja."}, {"no": 2, "en": "Building on what you identified above, which of your ministry's existing programmes, regulations or budget lines could be adjusted to deliver more nutrition benefit without new funding, and which would need genuinely new investment or authority?", "sw": "Kwa kuzingatia ulichokitambua hapo juu, ni zipi kati ya programu, kanuni au bajeti za wizara yako zilizopo zinaweza kurekebishwa ili kuleta manufaa zaidi ya lishe bila kuhitaji fedha mpya, na zipi zingehitaji uwekezaji mpya kabisa au mamlaka mapya?"}]}, {"header_en": "B. Budget and Resources", "header_sw": "B. Bajeti na Rasilimali", "is_open_header": false, "questions": [{"no": 3, "en": "Does your ministry have a specific, identifiable budget line for nutrition-relevant work, or is it folded into broader programme budgets where it cannot be tracked separately?", "sw": "Je, wizara yako ina kipengele mahususi cha bajeti kinachotambulika kwa ajili ya kazi zenye uhusiano na lishe, au kimechanganywa na bajeti pana za programu ambapo hakiwezi kufuatiliwa peke yake?"}, {"no": 4, "en": "If your ministry were to commit to one new nutrition-relevant action in the next five years, what would realistically be possible given your current budget and staffing?", "sw": "Iwapo wizara yako ingeamua kuchukua hatua moja mpya yenye uhusiano na lishe katika miaka mitano ijayo, ni nini kingewezekana kiuhalisia kulingana na bajeti na watumishi wa sasa?"}]}, {"header_en": "C. Coordination and Data", "header_sw": "C. Uratibu na Data", "is_open_header": false, "questions": [{"no": 5, "en": "How does your ministry currently coordinate with TFNC or other nutrition actors, and where does that coordination work well or fall short?", "sw": "Wizara yako inaratibiana vipi kwa sasa na TFNC au wadau wengine wa lishe, na uratibu huo unafanya kazi vizuri wapi au unashindwa wapi?"}, {"no": 6, "en": "What data does your ministry already collect, for its own purposes, that could help track nutrition outcomes if it were shared or used differently?", "sw": "Ni data gani ambazo wizara yako tayari inakusanya, kwa ajili ya matumizi yake yenyewe, ambazo zingeweza kusaidia kufuatilia matokeo ya lishe iwapo zingeshirikishwa au kutumika tofauti?"}]}, {"header_en": "D. Barriers", "header_sw": "D. Vikwazo", "is_open_header": false, "questions": [{"no": 7, "en": "What is the single biggest thing stopping your ministry from doing more on nutrition: mandate, budget, staffing, coordination, or something else?", "sw": "Ni nini kikubwa zaidi kinachozuia wizara yako kufanya zaidi kuhusu lishe: wajibu, bajeti, watu ght as expected", "sw": "Mtoto kutokua au kutoongezeka uzito ipasavyo"}, {"en": "Frequent illness that seemed related to diet", "sw": "Ugonjwa wa mara kwa mara unaohusiana na ulaji"}, {"en": "Noticeable weight gain or obesity-related health concern", "sw": "Kuongezeka uzito kwa kiasi kikubwa au tatizo la kiafya linalohusiana na unene"}, {"en": "Regularly not having enough food to eat", "sw": "Kukosa chakula cha kutosha mara kwa mara"}, {"en": "None of these", "sw": "Hakuna kati ya haya"}]}, {"no": 2, "type": "single_choice", "other": true, "en": "When your household cannot access good nutrition, what is usually the main reason?", "sw": "Kaya yako inaposhindwa kupata lishe bora, sababu kuu mara nyingi huwa ni ipi?", "options": [{"en": "Good food is too expensive", "sw": "Chakula bora ni ghali sana"}, {"en": "Good food is not available where we live", "sw": "Chakula bora hakipatikani tunapoishi"}, {"en": "We don't have enough time to prepare healthy meals", "sw": "Hatuna muda wa kutosha kuandaa milo bora"}, {"en": "Gender roles affect who decides or cooks in our household", "sw": "Majukumu ya kijinsia yanaathiri nani anayeamua au kupika katika kaya yetu"}, {"en": "We don't have enough information about healthy eating", "sw": "Hatuna elimu ya kutosha kuhusu ulaji bora"}, {"en": "Government or health services are not reaching us", "sw": "Huduma za serikali au afya hazitufikii"}, {"en": "This is not usually a problem for us", "sw": "Hii sio tatizo kwetu kwa kawaida"}]}, {"no": 3, "type": "single_choice", "other": false, "en": "Does your household's access to good food change during the year, for example around harvest time, floods or drought?", "sw": "Je, upatikanaji wa chakula bora katika kaya yako hubadilika kulingana na majira, kwa mfano wakati wa mavuno, mafuriko au ukame?", "options": [{"en": "Yes, much harder at certain times", "sw": "Ndiyo, ni ngumu zaidi nyakati fulani"}, {"en": "Yes, but only slightly", "sw": "Ndiyo, lakini kwa kiasi kidogo"}, {"en": "No, it stays about the same all year", "sw": "Hapana, hubaki karibu sawa mwaka mzima"}]}]}, {"header_en": "B. Where Services Actually Break Down", "header_sw": "B. Huduma Zinaposhindwa Kufikia", "is_open_header": false, "questions": [{"no": 4, "type": "single_choice", "other": false, "en": "Thinking about government nutrition or health services meant for families like yours, which best describes your experience?", "sw": "Ukizingatia huduma za serikali za lishe au afya zilizokusudiwa kwa familia kama yako, ni kauli ipi inayoelezea vizuri zaidi uzoefu wako?", "options": [{"en": "I don't know if such services exist near us", "sw": "Sijui kama huduma hizo zipo karibu nasi"}, {"en": "They exist, but we can't access them easily", "sw": "Zipo, lakini hatuzipati kwa urahisi"}, {"en": "They exist and we can access them, but quality or supply is often inadequate", "sw": "Zipo na tunazipata, lakini ubora au upatikanaji mara nyingi hautoshelezi"}, {"en": "They exist and generally work well for us", "sw": "Zipo na kwa ujumla zinatufaa vizuri"}]}, {"no": 5, "type": "single_choice", "other": false, "en": "If there was a simple way to report whether nutrition programmes in your area are actually working, would you take part?", "sw": "Iwapo kungekuwepo na njia rahisi ya kutoa maoni kuhusu ufanisi wa mipango ya lishe katika eneo lako, ungependa kushiriki?", "options": [{"en": "Yes, definitely", "sw": "Ndiyo, hakika"}, {"en": "Probably", "sw": "Pengine"}, {"en": "Only if it was very easy and quick", "sw": "Tu kama ingekuwa rahisi na ya haraka sana"}, {"en": "No, I wouldn't", "sw": "Hapana, nisingeshiriki"}, {"en": "Not sure", "sw": "Sina uhakika"}]}]}, {"header_en": "C. What Would Actually Change Things", "header_sw": "C. Nini Kingeleta Mabadiliko ya Kweli", "is_open_header": false, "questions": [{"no": 6, "type": "ranking", "en": "Rank your top 3 priorities for government investment in nutrition over the next five years:", "sw": "Panga vipaumbele vyako vitatu bora kwa uwekezaji wa serikali katika lishe, katika miaka mitano ijayo:", "options": [{"en": "Making healthy food cheaper (subsidies or tax changes)", "sw": "Kupunguza bei ya chakula bora (ruzuku au mabadiliko ya kodi)"}, {"en": "More community health workers doing home visits", "sw": "Watumishi zaidi wa afya ya jamii kufanya ziara za nyumbani"}, {"en": "Stronger school meal programmes", "sw": "Mipango imara zaidi ya chakula shuleni"}, {"en": "Clean water and sanitation investment", "sw": "Uwekezaji katika maji safi na usafi wa mazingira"}, {"en": "Support for farmers to grow more nutritious food", "sw": "Msaada kwa wakulima kuzalisha chakula chenye lishe zaidi"}, {"en": "Public education campaigns on healthy eating", "sw": "Kampeni za elimu kwa umma kuhusu ulaji bora"}, {"en": "Stronger rules on unhealthy food marketing, especially to children", "sw": "Kanuni imara zaidi za matangazo ya vyakula visivyo bora, hasa kwa watoto"}], "rank_count": 3}, {"no": 7, "type": "single_choice", "other": false, "en": "Do you think food and drinks marketed to children in Tanzania today are generally healthy or unhealthy?", "sw": "Je, unadhani vyakula na vinywaji vinavyotangazwa kwa watoto hapa nchini kwa sasa kwa ujumla vina ubora au havina ubora?", "options": [{"en": "Mostly healthy", "sw": "Vingi vina ubora"}, {"en": "Mixed, some healthy some not", "sw": "Mchanganyiko, vingine vina ubora vingine hapana"}, {"en": "Mostly unhealthy", "sw": "Vingi havina ubora"}, {"en": "I haven't thought about this", "sw": "Sijawahi kufikiria hili"}]}]}, {"header_en": "D. In Your Own Words", "header_sw": "D. Kwa Maneno Yako Mwenyewe", "is_open_header": false, "questions": [{"no": 8, "type": "open", "simple": true, "en": "If you could change ONE government decision to most improve nutrition for families like yours, what would it be?", "sw": "Iwapo ungeweza kubadilisha uamuzi MMOJA wa serikali ili kuboresha zaidi lishe kwa familia kama yako, uamuzi huo ungekuwa ni upi?"}]}], "closing_en": "Thank you for sharing your voice. Your response helps shape Tanzania's nutrition plan for the next 25 years.", "closing_sw": "Asante kwa kutoa sauti yako. Jibu lako linasaidia kuunda mpango wa lishe wa Tanzania kwa miaka 25 ijayo."}};

var CONTEXT = {"purpose": {"text_en": "This tool enables each stakeholder institution or network to contribute systematically to the development of Tanzania's National Nutrition Long-Term Plan (NN-LTP) 2026 to 2050 and the initial Five-Year Nutrition Plan (2026/27 to 2030/31). Each group has questions framed around where that group's own knowledge, mandate and experience add the greatest value.", "text_sw": "Chombo hiki kinawezesha kila taasisi au mtandao wa wadau kuchangia kwa utaratibu katika uandaaji wa Mpango wa Muda Mrefu wa Lishe wa Taifa (NN-LTP) 2026 hadi 2050 na Mpango wa Miaka Mitano wa awali wa Lishe (2026/27 hadi 2030/31). Kila kundi lina maswali yaliyoundwa kulingana na eneo ambalo ujuzi, wajibu na uzoefu wa kundi hilo una manufaa makubwa zaidi."}, "why": {"text_en": "The questions are written from the perspective of each stakeholder group, in plain language, so you can answer from your own mandate and experience rather than react to a generic checklist.", "text_sw": "Maswali yameandikwa kutoka mtazamo wa kila kundi la wadau, kwa lugha rahisi, ili uweze kujibu kutokana na wajibu na uzoefu wako mwenyewe badala ya kujibu orodha ya jumla."}, "how": {"text_en": "Select your stakeholder group above. Read the note explaining why your voice matters to the plan. Answer each question, and be specific with concrete examples where possible. Use the evidence field to reference data, documents or experiences that support your response. Mark how critical you consider each issue using the priority field. If a question is outside your knowledge, write not in our scope rather than leaving it blank.", "text_sw": "Chagua kundi lako la wadau hapo juu. Soma maelezo yanayoeleza kwa nini sauti yako ni muhimu kwa mpango huu. Jibu kila swali, na uwe mahususi ukitumia mifano halisi pale inapowezekana. Tumia sehemu ya ushahidi kurejea data, nyaraka au uzoefu unaothibitisha jibu lako. Onyesha umuhimu wa kila suala kwa kutumia sehemu ya kipaumbele. Iwapo swali liko nje ya ujuzi wako, andika si eneo letu badala ya kuacha wazi."}, "confidentiality": {"text_en": "Responses will be synthesised into the NN-LTP evidence base and consultation record. Individual responses will not be attributed by name without consent. Institutional positions will be attributed to the institution or network.", "text_sw": "Majibu yataunganishwa katika msingi wa ushahidi na kumbukumbu ya mashauriano ya NN-LTP. Majibu binafsi hayatahusishwa na jina bila ridhaa. Misimamo ya kitaasisi itahusishwa na taasisi au mtandao husika."}, "timeline": {"text_en": "Completed responses should be submitted within ten working days of receiving access to this tool, in line with the consultation architecture set out in the NN-LTP Inception Report (May 2026).", "text_sw": "Majibu yaliyokamilika yanapaswa kuwasilishwa ndani ya siku kumi za kazi tangu kupewa ufikiaji wa chombo hiki, kulingana na muundo wa mashauriano uliowekwa katika Ripoti ya Uanzishaji ya NN-LTP (Mei 2026)."}, "contact": {"text_en": "National Facilitator, NN-LTP Development Process, care of Tanzania Food and Nutrition Centre (TFNC), under the strategic oversight of the Prime Minister's Office.", "text_sw": "Mwezeshaji wa Kitaifa, Mchakato wa Uandaaji wa NN-LTP, kupitia Kituo cha Chakula na Lishe Tanzania (TFNC), chini ya usimamizi wa kimkakati wa Ofisi ya Waziri Mkuu."}};

<script>
// ============================================================
// helpers
// ============================================================
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function $(id){ return document.getElementById(id); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

let currentLang = 'en';
let currentKey = null;

function pick(obj, base){ return obj[base + '_' + currentLang]; }
function t(key){ return (UI[key] && UI[key][currentLang]) || key; }

// ============================================================
// choice-group helpers (single_choice / multi_choice / dropdown)
// ============================================================
const OTHER_SENTINEL = "__OTHER__";

function renderOptionsHtml(fieldKey, options, qtype, hasOther){
  const inputType = qtype === 'multi_choice' ? 'checkbox' : 'radio';
  const name = 'choice_' + fieldKey;
  let html = options.map(o => `
    <label class="choice-opt">
      <input type="${inputType}" ${qtype!=='multi_choice' ? `name="${name}"` : ''} value="${esc(o.en)}" data-choice-label-en="${esc(o.en)}">
      <span>${esc(currentLang==='en' ? o.en : o.sw)}</span>
    </label>`).join('');
  if(hasOther){
    html += `
    <label class="choice-opt">
      <input type="${inputType}" ${qtype!=='multi_choice' ? `name="${name}"` : ''} value="${OTHER_SENTINEL}" class="other-toggle">
      <span>${esc(t('other_option_label'))}</span>
    </label>
    <input type="text" class="other-input" data-other-for="${fieldKey}" placeholder="${esc(t('other_placeholder'))}" style="display:none">`;
  }
  return html;
}

function wireOtherToggle(container){
  const otherInput = container.querySelector('.other-input');
  if(!otherInput) return;
  container.querySelectorAll('input[type=radio], input[type=checkbox]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const otherChecked = container.querySelector('.other-toggle')?.checked;
      otherInput.style.display = otherChecked ? 'block' : 'none';
      if(!otherChecked) otherInput.value = '';
    });
  });
}

function serializeChoiceGroup(container){
  const qtype = container.getAttribute('data-qtype');
  const otherInput = container.querySelector('.other-input');
  if(qtype === 'dropdown'){
    const sel = container.querySelector('select');
    if(!sel || !sel.value) return '';
    if(sel.value === OTHER_SENTINEL) return otherInput && otherInput.value.trim() ? ('Other: ' + otherInput.value.trim()) : 'Other';
    return sel.value;
  }
  const checked = Array.from(container.querySelectorAll('input[type=radio]:checked, input[type=checkbox]:checked'));
  if(checked.length === 0) return '';
  const values = checked.map(c=>{
    if(c.value === OTHER_SENTINEL) return otherInput && otherInput.value.trim() ? ('Other: ' + otherInput.value.trim()) : 'Other';
    return c.value;
  });
  return values.join('; ');
}

function renderRankingHtml(fieldKey, options, rankCount){
  return options.map((o,i) => `
    <div class="rank-opt" data-rank-value="${esc(o.en)}">
      <span class="rank-badge"></span>
      <span class="rank-label">${esc(currentLang==='en' ? o.en : o.sw)}</span>
    </div>`).join('');
}

function getRankedSorted(opts){
  return opts.filter(o=>o.classList.contains('ranked'))
    .sort((a,b)=> (+(a.dataset.rankOrder||0)) - (+(b.dataset.rankOrder||0)));
}

function renumberRanking(opts, rankCount){
  const ranked = getRankedSorted(opts);
  ranked.forEach((o,i)=>{
    o.dataset.rankOrder = i+1;
    o.querySelector('.rank-badge').textContent = i+1;
  });
  opts.forEach(o=>{
    if(!o.classList.contains('ranked')){
      o.querySelector('.rank-badge').textContent = '';
      delete o.dataset.rankOrder;
      o.classList.toggle('rank-disabled', ranked.length >= rankCount);
    } else {
      o.classList.remove('rank-disabled');
    }
  });
}

function wireRankingInteraction(container, rankCount){
  const opts = Array.from(container.querySelectorAll('.rank-opt'));
  opts.forEach(o=>{
    o.addEventListener('click', ()=>{
      const ranked = getRankedSorted(opts);
      if(o.classList.contains('ranked')){
        o.classList.remove('ranked');
      } else if(ranked.length < rankCount){
        o.classList.add('ranked');
        o.dataset.rankOrder = 999999; // placeholder: sorts last until renumbered below
      } else {
        return;
      }
      renumberRanking(opts, rankCount);
      o.dispatchEvent(new Event('change', {bubbles:true}));
    });
  });
  renumberRanking(opts, rankCount);
}

function serializeRankingGroup(container){
  const ranked = Array.from(container.querySelectorAll('.rank-opt.ranked'))
    .sort((a,b)=> (+a.dataset.rankOrder) - (+b.dataset.rankOrder));
  if(ranked.length === 0) return '';
  return ranked.map((o,i)=> `${i+1}: ${o.getAttribute('data-rank-value')}`).join('; ');
}

function applyRankingValue(container, savedValue, rankCount){
  if(!savedValue) return;
  const parts = savedValue.split('; ');
  const opts = Array.from(container.querySelectorAll('.rank-opt'));
  parts.forEach(part=>{
    const m = part.match(/^(\d+):\s*(.*)$/);
    if(!m) return;
    const order = m[1];
    const val = m[2];
    const opt = opts.find(o=> o.getAttribute('data-rank-value') === val);
    if(opt){ opt.classList.add('ranked'); opt.dataset.rankOrder = order; }
  });
  const opts2 = Array.from(container.querySelectorAll('.rank-opt'));
  opts2.forEach(o=>{
    o.querySelector('.rank-badge').textContent = o.classList.contains('ranked') ? o.dataset.rankOrder : '';
  });
}

function applyChoiceGroupValue(container, savedValue){
  if(!savedValue) return;
  const qtype = container.getAttribute('data-qtype');
  const otherInput = container.querySelector('.other-input');
  const parts = qtype === 'multi_choice' ? savedValue.split('; ') : [savedValue];
  let usedOther = false;
  let otherText = '';
  parts.forEach(part=>{
    if(part.startsWith('Other')){
      usedOther = true;
      const idx = part.indexOf(':');
      otherText = idx > -1 ? part.slice(idx+1).trim() : '';
      return;
    }
    if(qtype === 'dropdown'){
      const sel = container.querySelector('select');
      if(sel) sel.value = part;
    } else {
      const inp = container.querySelector(`input[value="${CSS.escape(part)}"]`);
      if(inp) inp.checked = true;
    }
  });
  if(usedOther){
    if(qtype === 'dropdown'){
      const sel = container.querySelector('select');
      if(sel) sel.value = OTHER_SENTINEL;
    } else {
      const otherToggle = container.querySelector('.other-toggle');
      if(otherToggle) otherToggle.checked = true;
    }
    if(otherInput){ otherInput.style.display = 'block'; otherInput.value = otherText; }
  }
}

function draftKey(key){ return 'nnltp_draft_' + key; }

function collectCurrentValues(){
  const resp = {};
  document.querySelectorAll('#respondentBlock input[data-resp]').forEach(inp=>{
    resp[inp.getAttribute('data-resp')] = inp.value;
  });
  document.querySelectorAll('#respondentBlock .qselect-wrap[data-resp]').forEach(wrap=>{
    resp[wrap.getAttribute('data-resp')] = serializeChoiceGroup(wrap);
  });
  const fields = {};
  document.querySelectorAll('#sectionsContainer textarea[data-field], #sectionsContainer input[type=text][data-field], #sectionsContainer select[data-field]').forEach(inp=>{
    fields[inp.getAttribute('data-field')] = inp.value;
  });
  document.querySelectorAll('#sectionsContainer .choice-list[data-field], #sectionsContainer .qselect-wrap[data-field]').forEach(wrap=>{
    fields[wrap.getAttribute('data-field')] = serializeChoiceGroup(wrap);
  });
  document.querySelectorAll('#sectionsContainer .rank-list[data-field]').forEach(wrap=>{
    fields[wrap.getAttribute('data-field')] = serializeRankingGroup(wrap);
  });
  return { resp, fields, lang: currentLang, savedAt: new Date().toISOString() };
}

function saveDraft(){
  if(!currentKey) return;
  try{
    const draft = collectCurrentValues();
    localStorage.setItem(draftKey(currentKey), JSON.stringify(draft));
    return draft;
  }catch(e){ return null; }
}

function loadDraft(key){
  try{
    const raw = localStorage.getItem(draftKey(key));
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function clearDraft(key){
  try{ localStorage.removeItem(draftKey(key)); }catch(e){}
}

function applyDraft(draft){
  document.querySelectorAll('#respondentBlock input[data-resp]').forEach(inp=>{
    const idx = inp.getAttribute('data-resp');
    if(draft.resp && draft.resp[idx] !== undefined) inp.value = draft.resp[idx];
  });
  document.querySelectorAll('#respondentBlock .qselect-wrap[data-resp]').forEach(wrap=>{
    const idx = wrap.getAttribute('data-resp');
    if(draft.resp && draft.resp[idx] !== undefined) applyChoiceGroupValue(wrap, draft.resp[idx]);
  });
  document.querySelectorAll('#sectionsContainer textarea[data-field], #sectionsContainer input[type=text][data-field], #sectionsContainer select[data-field]').forEach(inp=>{
    const key = inp.getAttribute('data-field');
    if(draft.fields && draft.fields[key] !== undefined) inp.value = draft.fields[key];
  });
  document.querySelectorAll('#sectionsContainer .choice-list[data-field], #sectionsContainer .qselect-wrap[data-field]').forEach(wrap=>{
    const key = wrap.getAttribute('data-field');
    if(draft.fields && draft.fields[key] !== undefined) applyChoiceGroupValue(wrap, draft.fields[key]);
  });
  document.querySelectorAll('#sectionsContainer .rank-list[data-field]').forEach(wrap=>{
    const key = wrap.getAttribute('data-field');
    const rc = parseInt(wrap.getAttribute('data-rank-count'), 10) || 3;
    if(draft.fields && draft.fields[key] !== undefined) applyRankingValue(wrap, draft.fields[key], rc);
  });
  updateProgress();
}

}

    } else {

        container.appendChild(buildQCard(q.no, qtext, `q${q.no}`, false, q));
      });
    }
  });

  function buildQCard(num, text, fieldKey, isFinal, q){
    const card = document.createElement('div');
    card.className = 'qcard';
    const qtype = q.type || 'open';
    const respKey = fieldKey + '_response';

    let bodyHtml = '';
    if(qtype === 'open'){
      bodyHtml = `<textarea data-field="${respKey}" placeholder="${esc(t('response_placeholder'))}"></textarea>`;
      if(!isFinal && !q.simple){
        bodyHtml += `
        <div class="qsub-row">
          <div class="field">
            <label>${esc(t('evidence_label'))}</label>
            <input type="text" data-field="${fieldKey}_evidence">
          </div>
          <div class="field">
            <label>${esc(t('priority_label'))}</label>
            <select data-field="${fieldKey}_priority">
              <option value="">${esc(t('priority_select'))}</option>
              <option value="High">${esc(t('priority_high'))}</option>
              <option value="Medium">${esc(t('priority_medium'))}</option>
              <option value="Low">${esc(t('priority_low'))}</option>
            </select>
          </div>

      bodyHtml = `<div class="qselect-wrap" data-field="${respKey}" data-qtype="dropdown">
        <select>${optsHtml}</select>
        ${q.other ? `<input type="text" class="other-input" data-other-for="${respKey}" placeholder="${esc(t('other_placeholder'))}" style="display:none">` : ''}
      </div>`;
    } else if(qtype === 'ranking'){
      const rankCount = q.rank_count || 3;
      bodyHtml = `
        <div class="rank-hint">${esc(t('ranking_hint').replace('{n}', rankCount))}</div>
        <div class="rank-list" data-field="${respKey}" data-qtype="ranking" data-rank-count="${rankCount}">
          ${renderRankingHtml(respKey, q.options, rankCount)}
        </div>`;
    } else {
      // single_choice or multi_choice
      bodyHtml = `<div class="choice-list" data-field="${respKey}" data-qtype="${qtype}">
        ${renderOptionsHtml(respKey, q.options, qtype, !!q.other)}
      </div>`;
    }

    card.innerHTML = `
      <div class="qtext-en"><span class="qnum">${num ? num + '.' : ''}</span>${esc(text)}</div>
      ${bodyHtml}
    `;

    if(qtype === 'dropdown'){
      const wrap = card.querySelector('.qselect-wrap');
      const sel = wrap.querySelector('select');
      const oi = wrap.querySelector('.other-input');
      if(sel && oi){
        sel.addEventListener('change', ()=>{ oi.style.display = sel.value === OTHER_SENTINEL ? 'block' : 'none'; if(sel.value !== OTHER_SENTINEL) oi.value=''; });
      }
    } else if(qtype === 'single_choice' || qtype === 'multi_choice'){
      wireOtherToggle(card.querySelector('.choice-list'));
    } else if(qtype === 'ranking'){
      wireRankingInteraction(card.querySelector('.rank-list'), q.rank_count || 3);
    }

    return card;
  }

  $('closingBox').textContent = pick(g, 'closing');

  container.querySelectorAll('textarea, input[type=text], select, input[type=radio], input[type=checkbox]').forEach(el=>{
    el.addEventListener('input', updateProgress);
    el.addEventListener('change', updateProgress);
    el.addEventListener('input', scheduleAutosave);

  });
  container.querySelectorAll('.rank-list').forEach(el=>{

  });

  });

  $('draftBanner').style.display = 'none';

  const existingDraft = loadDraft(key);
  if(existingDraft){
    showDraftBanner(existingDraft);
  }
}

function updateProgress(){
  const container = $('sectionsContainer');
  const qcards = container.querySelectorAll('.qcard');
  let answered = 0;
  qcards.forEach(card=>{
    const ta = card.querySelector('textarea');
    if(ta){ if(ta.value.trim() !== '') answered++; return; }
    const choiceList = card.querySelector('.choice-list');
    if(choiceList){
      if(serializeChoiceGroup(choiceList).trim() !== '') answered++;
      return;
    }
    const selWrap = card.querySelector('.qselect-wrap');
    if(selWrap){
      if(serializeChoiceGroup(selWrap).trim() !== '') answered++;
      return;
    }
    const rankList = card.querySelector('.rank-list');
    if(rankList){
      if(serializeRankingGroup(rankList).trim() !== '') answered++;
      return;
    }
  });
  const total = qcards.length;
  const pct = total ? Math.round(answered/total*100) : 0;
  $('progressFill').style.width = pct + '%';
  const tmpl = t('progress_label');
  $('progressLabel').textContent = tmpl.replace('{a}', answered).replace('{n}', total);
}

// ============================================================
// ============================================================
// BUG FIX: prevent Enter key from silently auto-submitting the form
// when a respondent is typing in a short text field (Ministry, Name,
// Evidence, etc). Browsers submit a form by default on Enter inside
// any <input type="text">; textareas are unaffected since Enter just
// adds a newline there, and the submit button itself still works.
// ============================================================
$('qForm').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.getAttribute('type') !== 'submit'){
    e.preventDefault();
  }
});

  e.preventDefault();
  const g = DATA[currentKey];
  const btn = $('submitBtn');
  const status = $('statusBox');

  const formData = new FormData();
  formData.append('Stakeholder_Group', titleShort(g.title_en));
  formData.append('Stakeholder_Group_Key', currentKey);
  formData.append('Response_Language', currentLang);
  formData.append('Date_Completed', new Date().toISOString().slice(0,10));
  formData.append('Time_Completed', new Date().toTimeString().slice(0,8));
  formData.append('Mode', 'Online form (this tool)');
  formData.append('Questionnaire_Format', ['youth','consumers','community','public'].includes(currentKey) ? 'Simplified (choice-based)' : 'Standard (open text)');
  formData.append('Created', 'x-sheetmonkey-current-date-time');

  document.querySelectorAll('#respondentBlock input[data-resp]').forEach(inp=>{
    const idx = inp.getAttribute('data-resp');
    const label = g.resp_fields[idx].en.replace(/:\s*$/,'').replace(/\s*\(optional.*?\)/i,'');
    formData.append('Respondent_' + label.replace(/[^a-zA-Z0-9]+/g,'_'), inp.value);
  });
  document.querySelectorAll('#respondentBlock .qselect-wrap[data-resp]').forEach(wrap=>{
    const idx = wrap.getAttribute('data-resp');
    const label = g.resp_fields[idx].en.replace(/:\s*$/,'').replace(/\s*\(optional.*?\)/i,'');
    formData.append('Respondent_' + label.replace(/[^a-zA-Z0-9]+/g,'_'), serializeChoiceGroup(wrap));
  });
  document.querySelectorAll('#sectionsContainer textarea[data-field], #sectionsContainer input[type=text][data-field]').forEach(inp=>{
    formData.append(inp.getAttribute('data-field'), inp.value);
  });
  document.querySelectorAll('#sectionsContainer select[data-field]').forEach(inp=>{
    formData.append(inp.getAttribute('data-field'), inp.value);
  });
  document.querySelectorAll('#sectionsContainer .choice-list[data-field], #sectionsContainer .qselect-wrap[data-field]').forEach(wrap=>{
    formData.append(wrap.getAttribute('data-field'), serializeChoiceGroup(wrap));
  });
  document.querySelectorAll('#sectionsContainer .rank-list[data-field]').forEach(wrap=>{
    formData.append(wrap.getAttribute('data-field'), serializeRankingGroup(wrap));
  });

  btn.disabled = true; btn.textContent = t('submitting_btn');
  status.className = 'status';

  try{
    const resp = await fetch(SHEETMONKEY_URL, { method:'POST', body: formData });
    if(resp.ok){
      clearDraft(currentKey);
      $('confirmClosing').textContent = pick(g, 'closing');
      showScreen('screen-confirm');
      this.reset();
    } else {
      status.className = 'status err';
      status.textContent = t('submit_fail');
    }
  } catch(err){
    status.className = 'status err';
    status.textContent = t('submit_fail');
  }
  btn.disabled = false; btn.textContent = t('submit_btn');
});

// ============================================================
// save progress button
// ============================================================
$('saveProgressBtn').addEventListener('click', function(){
  saveDraft();
  updateSaveStatus();
});

// ============================================================
// direct-entry mode: a link with ?public=1 skips the group
// selector entirely and opens straight into the General Public
// questionnaire, with the "choose a different group" link hidden
// so the experience stays a single, focused form.
// ============================================================
function checkDirectEntry(){
  // The public questionnaire is now the default landing experience for
  // everyone. The full 20-group selector is reached only via the small
  // "explore more" link shown after a public submission, never directly.
  isDirectEntryMode = true;
  selectGroup('public');
  return true;
}

// ============================================================
// init
// ============================================================
$('exploreMoreLink').addEventListener('click', function(){
  isDirectEntryMode = false;
  showScreen('screen-select');
});

setLang('en');
checkDirectEntry();

</script>
